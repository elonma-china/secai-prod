[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "secai-agent-gateway"
version = "0.2.0"
description = "Private IAS v1-compatible agent gateway backed by Linch"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  # Pin <2: linch 2.0.0 (2026-09) bắt custom hook khai `resume_policy_id` cho "durable runs"
  # → gãy các hook của gateway (ToolCallBudgetHook…) làm chat/exploit 503. 1.2.x không có ràng
  # buộc này. Dockerfile pip-install từ pyproject (không dùng uv.lock) nên PHẢI pin ở đây.
  "linch>=1.2.1,<2",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.20",
  "python-docx>=1.2,<2",
  "markdown-it-py>=3,<5",
  "reportlab>=4,<5",
  "olefile>=0.47,<1",
  "lingua-language-detector==2.0.2",
  "regex>=2024.11,<2027",
  "pyyaml>=6",
  "fastembed>=0.4",
  # Runtime for the input-sanitization classifier head (matmul + softmax/sigmoid). Already
  # present transitively via fastembed; declared explicitly since we import it directly.
  "numpy>=1.26",
  "docxtpl>=0.16",
]

[project.optional-dependencies]
redis = ["redis>=5"]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "pypdf>=5,<7"]
# Offline-only: training the sanitization head (scripts/train_sanitize_head.py). NOT
# installed into the runtime/Docker image — the gateway stays numpy-only at serving time.
train = ["scikit-learn>=1.3", "sentence-transformers>=2.2"]
# Offline reward training / separate model serving, never installed in the CPU gateway.
reward = ["torch>=2.6,<3", "transformers==4.57.1", "tokenizers==0.22.1", "peft==0.17.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/secai_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
