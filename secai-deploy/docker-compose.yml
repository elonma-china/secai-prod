# SECAI deploy bundle — pulls the gateway image + spins up qdrant/neo4j/redis.
# Prereqs: ./fetch-data.sh (HF) then ./restore.sh (loads neo4j dump + recovers qdrant snapshot)
# must both complete before `docker compose up -d gateway`.
name: secai

services:
  gateway:
    image: secai1999/secai-gateway:1.0.0
    container_name: secai-gateway
    env_file:
      - .env
    # Path settings are re-pinned to in-container locations so host-oriented values that may
    # linger in .env can never break the container (same pattern as the image's own Dockerfile).
    environment:
      GATEWAY_DB_PATH: /app/data/gateway.db
      EXPLOITDB_ROOT: /srv/exploitdb
      SEARCHSPLOIT_BIN: /app/bin/searchsploit
      BM25_DIR: /srv/bm25/bm25_cve_kb
      POC_CATALOG_DB: /srv/poc/catalog.db
      POC_SOURCES_ROOT: /srv/poc-sources
      POC_ARTIFACT_STORE: /srv/poc-store
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_HTTP_PORT: "7474"
      REDIS_URL: redis://redis:6379
    ports:
      - "8131:8131"
    volumes:
      - gateway-data:/app/data
      - ./data/exploitdb:/srv/exploitdb:ro
      - ./data/bm25:/srv/bm25:ro
      # rw (not :ro): PocCatalog opens sqlite with PRAGMA journal_mode=WAL, which needs to
      # create catalog.db-wal / catalog.db-shm next to catalog.db on first query.
      - ./data/poc:/srv/poc
      - ./data/poc-store:/srv/poc-store:ro
      - ./data/poc-sources:/srv/poc-sources:ro
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.10.1   # MUST match the version the snapshot was made with
    restart: unless-stopped
    ulimits:                      # large collection opens many RocksDB .sst files
      nofile: { soft: 262144, hard: 262144 }
    ports:
      # Loopback-only — never reachable off this host. Exists solely so restore.sh (running on
      # the host) can call the Qdrant REST API to recover the snapshot; the gateway itself talks
      # to qdrant over the internal compose network (http://qdrant:6333), not this binding.
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
      - ./data/qdrant:/qdrant/snapshots   # contains cve_kb.snapshot for recovery
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  neo4j:
    image: neo4j:5.20-community
    restart: unless-stopped
    # No ports published: the gateway reaches it over bolt://neo4j:7687 on the internal compose
    # network; the offline dump load (restore.sh) uses `docker run` + volume mounts, not HTTP.
    environment:
      # Username defaults to neo4j (the only account 5.20-community provisions); if you override
      # NEO4J_USER in .env, it must stay `neo4j` or every gateway graph query 401s. The `:?`
      # guard makes `docker compose up` fail fast if NEO4J_PASSWORD isn't set in .env.
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env before compose up}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2g
    volumes:
      # BIND mounts (not named volumes): restore.sh offline-loads neo4j.dump into ./_state/neo4j_data
      # on the host BEFORE this service starts, so the service must mount that exact path — a named
      # volume would start empty and the graph would silently return 0 rows. (Qdrant differs: it
      # recovers via the REST API against the live service, so a named volume is fine there.)
      - ./_state/neo4j_data:/data
      - ./_state/neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  gateway-data:
  qdrant_storage:
  redis_data:
  # neo4j uses BIND mounts (./_state/neo4j_data, ./_state/neo4j_logs) populated by restore.sh —
  # deliberately NOT named volumes here (see the neo4j service comment above).
