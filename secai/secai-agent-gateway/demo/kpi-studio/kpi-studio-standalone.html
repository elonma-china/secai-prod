<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KPI Studio — secAI (mô phỏng offline)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900&display=swap" rel="stylesheet" />
<style>
:root {
  color-scheme: dark;
  --bg: #0b1220;
  --panel: #131b2e;
  --panel-2: #0f1626;
  --border: #253253;
  --text: #e6ebf5;
  --muted: #8b97b3;
  --accent: #00e5c7;        /* teal-cyan — nhấn, khác accent xanh dương của trang showcase gốc */
  --accent-2: #7c5cff;      /* tím — nút chính, cho "studio" 1 nhận diện riêng */
  --accent-2-dark: #6647e0;
  --ok: #34d399;
  --ok-bg: rgba(17, 128, 68, .25);
  --fail: #f87171;
  --fail-bg: rgba(184, 32, 32, .28);
  --warn: #fbbf24;
  --warn-bg: rgba(180, 83, 9, .28);
  --radius: 12px;
  --shadow: 0 1px 3px rgba(0, 0, 0, .35), 0 1px 2px rgba(0, 0, 0, .25);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}
a { color: var(--accent); }

/* ── Shell: sidebar cố định + nội dung ────────────────── */
.shell { display: grid; grid-template-columns: 268px 1fr; min-height: 100vh; }
.sidebar {
  background: linear-gradient(180deg, #101a30, #0c1424 60%);
  border-right: 1px solid var(--border);
  padding: 22px 16px; display: flex; flex-direction: column; gap: 18px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 4px; }
.brand-mark {
  width: 40px; height: 40px; flex: none;
  display: grid; place-items: center;
  color: var(--accent);
  background: rgba(0, 229, 199, .1);
  border: 1px solid rgba(0, 229, 199, .45);
  border-radius: 11px; font-weight: 800; font-size: 15px;
}
.brand h1 { margin: 0; font-size: 17px; font-weight: 800; color: #fff; }
.brand .sub { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }

nav#nav { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
nav#nav button {
  text-align: left; padding: 10px 12px; border: none; border-radius: 9px;
  background: transparent; color: var(--muted); cursor: pointer;
  font-family: inherit; font-size: 13.5px; font-weight: 600;
  transition: background .15s, color .15s;
}
nav#nav button:hover { background: rgba(0, 229, 199, .08); color: var(--accent); }
nav#nav button.active { background: var(--accent-2); color: #fff; }

.sidebar-status { margin-top: auto; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel-2); }
.sidebar-status .pill { display: block; text-align: center; margin-bottom: 6px; }

main#main { padding: 26px 34px 72px; max-width: 1180px; }
main#main > h2:first-child { margin-top: 0; }
h2.page-title { font-size: 20px; font-weight: 800; color: #fff; margin: 0 0 16px; }

/* ── Card / row / button primitives (tự chứa, không phụ thuộc trang khác) ── */
.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 16px;
}
.card h3 { margin: 0 0 12px; font-size: 15px; font-weight: 700; color: #fff; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

button.run {
  background: var(--accent-2); color: #fff; border: none; border-radius: 9px;
  padding: 8px 16px; cursor: pointer; font-size: 13.5px; font-weight: 700; font-family: inherit;
  transition: background .15s;
}
button.run:hover { background: var(--accent-2-dark); }
button.run:disabled { opacity: .45; cursor: default; }
button.run.active { outline: 2px solid var(--accent); }

input, select {
  padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-family: inherit; font-size: 13px;
}

.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.fail { background: var(--fail-bg); color: var(--fail); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }

.progress { height: 8px; background: #060c18; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin: 10px 0; }
.progress > div { height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); width: 0%; transition: width .12s linear; }

table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
th { background: var(--panel-2); font-weight: 600; color: var(--muted); }
tbody tr:nth-child(even) td { background: rgba(255, 255, 255, .02); }
td code, .card code { background: #060c18; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; color: #cdd6ea; }

pre.run-log {
  white-space: pre-wrap; word-break: break-word; background: #060a14; color: #5ef2c8;
  border: 1px solid var(--border); padding: 12px; border-radius: 8px; font-size: 12.5px;
  line-height: 1.55; font-family: ui-monospace, "SF Mono", Consolas, monospace;
  max-height: 340px; overflow-y: auto;
}

.hist-bars { display: flex; gap: 6px; align-items: flex-end; height: 96px; margin: 12px 0 6px; }
.hist-bar { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
.hist-bar > i { display: block; width: 100%; max-width: 46px; border-radius: 4px 4px 0 0; background: var(--ok); opacity: .85; }
.hist-bar > i.fail { background: var(--fail); }
.hist-bar > span { font-size: 10px; color: var(--muted); }

.hist-log { margin: 8px 0; }
.hist-log > summary { cursor: pointer; font-size: 13px; color: var(--muted); padding: 4px 0; }
.hist-log > summary:hover { color: var(--accent); }
.hist-log .pill { margin-left: 6px; }

p.hint, .hint { color: var(--muted); font-size: 13px; }
.error { color: var(--fail); font-size: 14px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; }
  main#main { padding: 20px 16px 56px; }
}

</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">KS</span>
      <div>
        <h1>KPI Studio</h1>
        <p class="sub">secAI — 19 KPI nghiệm thu (mô phỏng offline)</p>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-status" id="sidebar-status">
      <p class="hint">Đang tải…</p>
    </div>
  </aside>
  <main id="main">
    <p class="hint">Đang tải…</p>
  </main>
</div>
<script type="module">

/* ============================== "API" giả — trả đúng dữ liệu tĩnh ở trên ============================== */
async function apiGet(path) {
  const url = new URL(path, "http://mock.local");
  if (url.pathname === "/showcase-api/kpi-studio/catalog") return MOCK_CATALOG;
  if (url.pathname === "/showcase-api/kpi-studio/datasets") return MOCK_DATASETS_LIST;
  if (url.pathname === "/showcase-api/kpi-studio/service-status") return MOCK_SERVICE_STATUS;
  const m = url.pathname.match(/^\/showcase-api\/kpi-studio\/datasets\/(.+)$/);
  if (m) {
    const key = decodeURIComponent(m[1]);
    const page = Number(url.searchParams.get("page") || 1);
    const pageSize = Number(url.searchParams.get("page_size") || 20);
    return mockDatasetPage(key, page, pageSize);
  }
  throw new Error("Không có mock cho " + path);
}
const api = { get: apiGet };

function mockDatasetPage(key, page, pageSize) {
  const meta = MOCK_DATASETS_LIST.datasets.find((d) => d.key === key);
  const allCached = MOCK_DATASET_ROWS[key] || [];
  const realTotal = DATASET_TOTAL_OVERRIDE[key] || allCached.length;
  const start = (page - 1) * pageSize;
  const rows = allCached.slice(start, start + pageSize);
  return {
    key, label: meta ? meta.label : key, source: meta ? meta.source : "",
    total_rows: realTotal, page, page_size: pageSize,
    total_pages: Math.max(1, Math.ceil(allCached.length / pageSize)),
    rows,
    _capped_note: allCached.length < realTotal
      ? `Bản mô phỏng offline chỉ cache ${allCached.length}/${realTotal} dòng đầu (đủ để xem phân trang) — bộ đầy đủ đọc thật qua bản có API.`
      : null,
  };
}

  SECTIONS.forEach((s) => {
    const btn = document.createElement("button");
    btn.textContent = s.label;
    btn.dataset.id = s.id;
    btn.addEventListener("click", () => { location.hash = s.id; });
    nav.appendChild(btn);
  });
  loadSidebarStatus();
  window.addEventListener("hashchange", openFromHash);
  openFromHash();
}

function openFromHash() {
  const id = location.hash.replace(/^#/, "") || SECTIONS[0].id;
  const sec = SECTIONS.find((s) => s.id === id) || SECTIONS[0];
  [...nav.children].forEach((b) => b.classList.toggle("active", b.dataset.id === sec.id));

  if (!rendered.has(sec.id)) {
    const panel = document.createElement("div");
    panel.innerHTML = `<h2 class="page-title">${esc(sec.title)}</h2><div class="sec-body"><p class="hint">Đang tải…</p></div>`;
    rendered.set(sec.id, panel);
    sec.fn(panel.querySelector(".sec-body"), state).catch((err) => {
      panel.querySelector(".sec-body").innerHTML = `<p class="error">Lỗi tải "${esc(sec.label)}": ${esc(err.message)}</p>`;
    });
  }
  main.innerHTML = "";
  main.appendChild(rendered.get(sec.id));
}

async function loadSidebarStatus() {
  const box = document.getElementById("sidebar-status");

  box.innerHTML = data.ready_to_bench
    ? `<span class="pill ok">SẴN SÀNG</span><p class="hint">4/4 dịch vụ OK</p>`
    : `<span class="pill fail">CHƯA SẴN SÀNG</span><p class="hint">${okCount}/4 dịch vụ OK — xem mục Trạng thái dịch vụ</p>`;
}

        (${esc(meta.kpi_thu_12_khong_nguong.note)})
      </p>
      <p class="hint">
        + Mã thứ 20 mồ côi <code>${esc(meta.ma_thu_20_mo_coi.code)}</code>
        (${esc(meta.ma_thu_20_mo_coi.note)})
      </p>
    </div>
    <div class="row" id="ks-ov-filters" style="margin-bottom:4px"></div>
    <div class="grid-cards" id="ks-ov-list"></div>
  `;
  const filters = panel.querySelector("#ks-ov-filters");
  const list = panel.querySelector("#ks-ov-list");
  const groupBtns = [{ id: "*", name: "Tất cả" }, ...groups].map((g) => {
    const btn = document.createElement("button");
    btn.className = "run"; btn.textContent = g.id === "*" ? "Tất cả" : `Nhóm ${g.id}`; btn.dataset.g = g.id;
    return btn;
  });
  const search = document.createElement("input");
  search.placeholder = "Tìm theo mã hoặc tên KPI…";
  search.style.flex = "1"; search.style.minWidth = "200px";

  let activeGroup = "*";
  function draw() {
    groupBtns.forEach((b) => b.classList.toggle("active", b.dataset.g === activeGroup));
    const q = search.value.trim().toLowerCase();
    const rows = kpis.filter((k) =>
      (activeGroup === "*" || k.group === activeGroup) &&
      (!q || k.code.toLowerCase().includes(q) || k.name.toLowerCase().includes(q)));
    list.innerHTML = rows.length ? rows.map(kpiCard).join("") : `<p class="hint">Không có KPI khớp bộ lọc.</p>`;
  }
  groupBtns.forEach((b) => { b.addEventListener("click", () => { activeGroup = b.dataset.g; draw(); }); filters.appendChild(b); });
  filters.appendChild(search);
  search.addEventListener("input", draw);
  draw();
}

function kpiCard(k) {
  const deps = (k.depends_on || []).map((d) => `<code>${esc(d)}</code>`).join(", ") || "<span class=\"hint\">không</span>";
  const dsKeys = (k.dataset_keys || []).map((d) => `<code>${esc(d)}</code>`).join(", ");
  return `
    <div class="card" data-code="${esc(k.code)}">
      <h3><code>${esc(k.code)}</code> · ${esc(k.name)} <span class="hint">— nhóm ${esc(k.group)}</span></h3>
      <div class="row">${enforcedPill(k.enforced)}<strong>${esc(k.threshold_display)}</strong></div>
      <p><strong>Đạt/không đạt:</strong> ${esc(k.pass_rule)}</p>
      <p><strong>Tính toán:</strong> ${esc(k.formula)}</p>
      <p><strong>Dữ liệu:</strong> ${esc(k.dataset)} ${dsKeys ? `(xem mục Bộ dữ liệu: ${dsKeys})` : ""}</p>
      <p class="hint"><strong>Phụ thuộc:</strong> ${deps} · <strong>Script:</strong> <code>${esc(k.script)}</code></p>
      ${k.note ? `<p class="hint">⚠ ${esc(k.note)}</p>` : ""}
    </div>`;
}

/* ============================== 2) Bộ dữ liệu ============================== */
async function renderDatasets(panel, state) {
  panel.innerHTML = `
    <div class="card">
      <h3>Nhập thêm bộ dữ liệu</h3>
      <div class="row">
        <div style="flex:1;min-width:260px">
          <p class="hint">Tải lên từ máy (.jsonl, mỗi dòng 1 JSON) — xử lý ngay trên trình duyệt.</p>
          <input type="file" id="ks-upload-input" accept=".jsonl,.json,.txt" />
          <p class="hint" id="ks-upload-msg"></p>
        </div>
        <div style="flex:1;min-width:260px;border-left:1px solid var(--border);padding-left:16px">
          <p class="hint">Nhập từ Hugging Face — <strong>demo mô phỏng</strong>.</p>
          <div class="row">
            <input id="ks-hf-repo" placeholder="vd. DuyTa/Cyber_F1_v2" style="flex:1;min-width:160px" />
            <button class="run" id="ks-hf-go">Nhập (mô phỏng)</button>
          </div>
          <div class="progress" id="ks-hf-progress" hidden><div></div></div>
          <p class="hint" id="ks-hf-msg"></p>
        </div>
      </div>
    </div>
    <div id="ks-ds-list"></div>
    <div id="ks-ds-viewer"></div>
  `;
  const listEl = panel.querySelector("#ks-ds-list");
  const viewerEl = panel.querySelector("#ks-ds-viewer");
  let customDatasets = [];

  async function loadList() {
    const { datasets } = await api.get("/showcase-api/kpi-studio/datasets");
    listEl.innerHTML = `
      <div class="card">
        <h3>Bộ dữ liệu dùng để bench</h3>
        <table>
          <thead><tr><th>Bộ dữ liệu</th><th>Mô tả</th><th>Số dòng</th><th>Dùng cho KPI</th><th></th></tr></thead>
          <tbody>
            ${datasets.map((d) => `
              <tr>
                <td><code>${esc(d.key)}</code><br/><span class="hint">${esc(d.label)}</span></td>
                <td>${esc(d.description)}</td>
                <td>${d.available ? fmtNum(d.row_count) : `<span class="pill fail">thiếu file</span>`}</td>
                <td>${d.used_by.map((c) => `<code>${esc(c)}</code>`).join(" ")}</td>
                <td><button class="run" data-view="${esc(d.key)}" ${d.available ? "" : "disabled"}>Xem</button></td>
              </tr>`).join("")}
            ${customDatasets.map((d) => `
              <tr>
                <td><code>${esc(d.key)}</code><br/><span class="pill warn">tải lên / mô phỏng</span></td>
                <td>${esc(d.description)}</td>
                <td>${fmtNum(d.rows.length)}</td>
                <td><span class="hint">chưa gắn KPI nào</span></td>
                <td><button class="run" data-view-custom="${esc(d.key)}">Xem</button> <button class="run" data-del-custom="${esc(d.key)}">Xoá</button></td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>`;
    listEl.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => viewRemoteDataset(viewerEl, b.dataset.view)));
    listEl.querySelectorAll("[data-view-custom]").forEach((b) => b.addEventListener("click", () => viewLocalDataset(viewerEl, b.dataset.viewCustom)));
    listEl.querySelectorAll("[data-del-custom]").forEach((b) => b.addEventListener("click", () => {
      customDatasets = customDatasets.filter((d) => d.key !== b.dataset.delCustom); loadList();
    }));
  }
  await loadList();
  // Mở sẵn 1 ví dụ phân trang ngay khi vào mục này — "xem hết thành phần" không cần bấm gì trước.
  viewRemoteDataset(viewerEl, "perf_bench_100");

  panel.querySelector("#ks-upload-input").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    const msg = panel.querySelector("#ks-upload-msg");
    if (!file) return;
    msg.textContent = "Đang đọc…";
    try {
      const text = await file.text();
      const rows = text.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => {
        try { return JSON.parse(l); } catch { return { _raw: l }; }
      });
      if (!rows.length) throw new Error("File rỗng hoặc không đọc được dòng nào.");
      customDatasets.push({ key: `upload_${Date.now()}`, description: `Tải lên từ "${file.name}" (${rows.length} dòng)`, rows });
      msg.textContent = `Đã nạp ${rows.length} dòng từ ${file.name}.`;
      await loadList();
    } catch (err) { msg.textContent = `Lỗi: ${err.message}`; }

  panel.querySelector("#ks-hf-go").addEventListener("click", async () => {

    if (!repo) { msg.textContent = "Nhập dataset id trên Hugging Face trước (vd DuyTa/Cyber_F1_v2)."; return; }
    bar.hidden = false; inner.style.width = "0%";
    msg.textContent = "Đang mô phỏng tải…";
    for (const pct of [20, 45, 70, 90, 100]) { await new Promise((r) => setTimeout(r, 180)); inner.style.width = pct + "%"; }
    customDatasets.push({ key: `hf_${Date.now()}`, description: `Mô phỏng nhập từ Hugging Face: ${repo}`,
      rows: [{ _note: `Dữ liệu MÔ PHỎNG — bản offline này không gọi HF Hub thật.` }] });
    msg.textContent = `Xong (mô phỏng) — đã thêm vào danh sách bên dưới.`;
    await loadList();
  });
}

function rowsToTable(rows) {
  if (!rows.length) return `<p class="hint">Không có dòng nào.</p>`;
  const cols = Object.keys(rows[0]);
  const cell = (v) => {
    if (v == null) return "";
    if (typeof v === "object") { const s = JSON.stringify(v); return esc(s.length > 140 ? s.slice(0, 140) + "…" : s); }
    const s = String(v); return esc(s.length > 200 ? s.slice(0, 200) + "…" : s);
  };
  return `<table><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>
    ${rows.map((r) => `<tr>${cols.map((c) => `<td>${cell(r[c])}</td>`).join("")}</tr>`).join("")}
  </tbody></table>`;
}

async function viewRemoteDataset(viewerEl, key, page = 1, pageSize = 8) {
  viewerEl.innerHTML = `<p class="hint">Đang tải…</p>`;
  const data = await api.get(`/showcase-api/kpi-studio/datasets/${encodeURIComponent(key)}?page=${page}&page_size=${pageSize}`);
  viewerEl.innerHTML = `
    <div class="card">
      <h3>${esc(data.label)} <span class="hint">(${esc(data.source)})</span></h3>
      ${data._capped_note ? `<p class="hint">${esc(data._capped_note)}</p>` : ""}
      <div class="row" id="ks-pg-ctrl"></div>
      ${rowsToTable(data.rows)}
      <div class="row" id="ks-pg-ctrl-bottom"></div>
    </div>`;
  const ctrl = () => `
    <button class="run" data-p="prev" ${data.page <= 1 ? "disabled" : ""}>‹ Trước</button>
    <span class="hint">Trang ${data.page}/${data.total_pages} — tổng ${data.total_rows} dòng</span>
    <button class="run" data-p="next" ${data.page >= data.total_pages ? "disabled" : ""}>Sau ›</button>`;
  ["#ks-pg-ctrl", "#ks-pg-ctrl-bottom"].forEach((sel) => { viewerEl.querySelector(sel).innerHTML = ctrl(); });
  viewerEl.querySelectorAll("[data-p]").forEach((b) =>
    b.addEventListener("click", () => viewRemoteDataset(viewerEl, key, data.page + (b.dataset.p === "next" ? 1 : -1), pageSize)));
}

function viewLocalDataset(viewerEl, key) {
  viewerEl.innerHTML = `<p class="hint">(bộ tải lên/mô phỏng — xem trực tiếp trong danh sách phía trên)</p>`;
}

/* ============================== 3) Trạng thái dịch vụ ============================== */

  panel.innerHTML = `
    <div class="card">
      <div class="row">
        <h3 style="margin:0">4 dịch vụ backend cần để bench</h3>
        <button class="run" id="ks-status-refresh">Kiểm tra lại (mô phỏng)</button>
      </div>
      <p class="hint">Ảnh chụp thật lúc build file này — bản offline không gọi lại được, bấm "Kiểm tra lại" chỉ replay đúng ảnh chụp.</p>
      <div id="ks-status-body"><p class="hint">Đang tải…</p></div>
    </div>`;

    await new Promise((r) => setTimeout(r, 400));
    const data = await api.get("/showcase-api/kpi-studio/service-status");

function statusCard(c) {
  const rows = [];
  if (c.url) rows.push(`URL: <code>${esc(c.url)}</code>`);
  if (c.model) rows.push(`Model: <code>${esc(c.model)}</code>`);
  if (c.collection) rows.push(`Collection: <code>${esc(c.collection)}</code>` + (c.points_count != null ? ` (${fmtNum(c.points_count)} điểm)` : ""));
  if (c.latency_ms != null) rows.push(`Độ trễ: ${fmtNum(c.latency_ms)} ms`);
  if (c.http_status != null) rows.push(`HTTP: ${c.http_status}`);
  if (c.detail) rows.push(`<span class="hint">${esc(c.detail)}</span>`);
  return `
    <div class="card">
      <h3>${esc(c.role.toUpperCase())} ${c.ok ? `<span class="pill ok">OK</span>` : `<span class="pill fail">LỖI</span>`}</h3>
      ${rows.map((r) => `<p class="hint">${r}</p>`).join("")}
    </div>`;
}

/* ============================== 4) Chạy bench (mô phỏng — không SSE thật) ============================== */
async function renderRunBench(panel, state) {
  const { groups, kpis } = state.catalog;
  panel.innerHTML = `
    <div class="card">
      <h3>Chọn phạm vi chạy</h3>
      <div class="row" id="ks-scope-btns"></div>
      <div class="row" id="ks-scope-detail"></div>
      <div class="row"><button class="run" id="ks-run-go">Chạy (mô phỏng)</button><span class="hint run-elapsed" id="ks-run-elapsed"></span></div>
      <div class="progress" id="ks-run-progress" hidden><div></div></div>
    </div>
    <div class="card"><h3>Log realtime</h3><pre class="run-log" id="ks-run-log"></pre></div>
    <div id="ks-run-results"></div>
  `;
  const scopeBtns = panel.querySelector("#ks-scope-btns");
  const scopeDetail = panel.querySelector("#ks-scope-detail");
  const goBtn = panel.querySelector("#ks-run-go");
  const logEl = panel.querySelector("#ks-run-log");
  const progress = panel.querySelector("#ks-run-progress");
  const progressInner = progress.querySelector("div");
  const elapsedEl = panel.querySelector("#ks-run-elapsed");
  const resultsEl = panel.querySelector("#ks-run-results");

  let scope = "single";
  const SCOPES = [{ id: "single", label: "Từng KPI" }, { id: "group", label: "Cả 1 nhóm" }, { id: "all", label: "Tất cả 19" }];
  SCOPES.forEach((s) => {
    const b = document.createElement("button");
    b.className = "run"; b.textContent = s.label; b.dataset.s = s.id;
    b.addEventListener("click", () => { scope = s.id; drawScope(); });
    scopeBtns.appendChild(b);
  });
  function drawScope() {
    [...scopeBtns.children].forEach((b) => b.classList.toggle("active", b.dataset.s === scope));
    if (scope === "single") {
      const def = "R-LLM-REMED60"; // có log thật đầy đủ nhất để minh hoạ
      scopeDetail.innerHTML = `<select id="ks-pick-kpi">${kpis.map((k) => `<option value="${esc(k.code)}" ${k.code === def ? "selected" : ""}>${esc(k.code)} — ${esc(k.name)}</option>`).join("")}</select>`;
    } else if (scope === "group") {
      scopeDetail.innerHTML = groups.map((g) => `<label class="hint"><input type="radio" name="ks-pick-group" value="${g.id}" ${g.id === "A" ? "checked" : ""}/> Nhóm ${g.id} — ${esc(g.name)} (${g.count})</label>`).join(" ");
    } else {
      scopeDetail.innerHTML = `<p class="hint">Mô phỏng tuần tự cả 19 KPI (log rút gọn cho từng KPI, trừ R-LLM-REMED60 có log đầy đủ).</p>`;
    }
  }
  drawScope();

  function testsForScope() {
    if (scope === "single") return kpis.filter((k) => k.code === panel.querySelector("#ks-pick-kpi").value);
    if (scope === "group") {
      const g = panel.querySelector('input[name="ks-pick-group"]:checked')?.value || "A";
      return kpis.filter((k) => k.group === g);
    }
    return kpis;
  }

  goBtn.addEventListener("click", async () => {
    const tests = testsForScope();
    if (!tests.length) return;
    goBtn.disabled = true;
    logEl.textContent = ""; resultsEl.innerHTML = "";
    progress.hidden = false; progressInner.style.width = "0%";
    const started = performance.now();
    const ticker = setInterval(() => {
      const s = Math.floor((performance.now() - started) / 1000);
      elapsedEl.textContent = `đang chạy… ${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
    }, 200);

    const results = [];
    for (let i = 0; i < tests.length; i++) {
      const t = tests[i];
      logEl.textContent += `\n===== [${i + 1}/${tests.length}] ${t.code} — ${t.name} =====\n`;
      logEl.scrollTop = logEl.scrollHeight;
      const r = await simulateRunOneTest(t, logEl, (frac) => {
        progressInner.style.width = Math.min(99, ((i + frac) / tests.length) * 100) + "%";
      });
      results.push(r);
      resultsEl.innerHTML = renderRunSummary(results);
    }
    progressInner.style.width = "100%";
    clearInterval(ticker); elapsedEl.textContent = ""; goBtn.disabled = false;
    state.history.unshift({ scope, results, at: new Date().toISOString() });
    resultsEl.innerHTML = renderRunSummary(results) + `<p class="hint">Đã thêm vào mục "Lịch sử & biểu đồ".</p>`;
    rendered.delete("history"); // buộc render lại History lần sau mở, cho thấy lần chạy vừa xong
  });
}

// Mô phỏng 1 lần chạy: log = log thật (nếu có) hoặc log rút gọn tự sinh; kết quả = số đo thật
// (nếu có trong MOCK_RESULT_ROWS) hoặc số minh hoạ tính từ ngưỡng trong catalog.
function simulateRunOneTest(kpi, logEl, onProgress) {
  return new Promise((resolve) => {
    const real = MOCK_RESULT_ROWS.find((r) => r.test_id === kpi.code);
    const value = real ? real.value : illustrativeValue(kpi);
    const pass = real ? real.pass : true;
    const result = { test_id: kpi.code, name: kpi.name, unit: kpi.unit, threshold: kpi.threshold_display, value, pass };

    const lines = kpi.code === "R-LLM-REMED60"
      ? MOCK_REMED_LOG_LINES
      : [
          `input: (mô phỏng offline) ${kpi.dataset}`,
          `... đang chấm theo công thức: ${kpi.formula}`,
          `${kpi.code}  ${fmtNum(value)}${kpi.unit ? " " + kpi.unit : ""}  thr ${kpi.threshold_display}  ${pass ? "✅ ĐẠT" : "❌ CHƯA ĐẠT"}`,
        ];
    const perLineMs = Math.max(20, Math.min(90, 2500 / lines.length));
    let i = 0;
    const timer = setInterval(() => {
      if (i >= lines.length) {
        clearInterval(timer);
        resolve(result);
        return;
      }
      logEl.textContent += lines[i] + "\n";
      logEl.scrollTop = logEl.scrollHeight;
      onProgress((i + 1) / lines.length);
      i++;
    }, perLineMs);
  });
}

function illustrativeValue(kpi) {
  const thr = kpi.threshold;
  if (Array.isArray(thr)) return Math.round(((thr[0] + thr[1]) / 2) * 10) / 10;
  const n = Number(thr);
  if (!Number.isFinite(n)) return 0;
  if (kpi.op === "<" || kpi.op === "<=") return Math.round(n * 0.6 * 10) / 10;
  return Math.round(n * 1.05 * 10) / 10;
}

function renderRunSummary(results) {
  const ok = results.filter((r) => r.pass).length;
  const total = results.length;
  return `
    <div class="card">
      <h3>Kết quả (${ok}/${total} đạt)</h3>
      <table><thead><tr><th>Mã</th><th>Tên</th><th>Giá trị</th><th>Ngưỡng</th><th></th></tr></thead><tbody>
        ${results.map((r) => `<tr><td><code>${esc(r.test_id)}</code></td><td>${esc(r.name)}</td><td>${fmtNum(r.value)} ${esc(r.unit || "")}</td><td>${esc(r.threshold)}</td><td>${passPill(r.pass)}</td></tr>`).join("")}
      </tbody></table>
    </div>`;
}

/* ============================== 5) Lịch sử & biểu đồ ============================== */
async function renderHistory(panel, state) {
  const runs = state.history;
  if (!runs.length) {
    panel.innerHTML = `<div class="card"><p class="hint">Chưa có lần chạy nào. Sang mục "Chạy bench" để chạy thử.</p></div>`;
    return;
  }
  const thrByCode = new Map(state.catalog.kpis.map((k) => [k.code, k]));
  panel.innerHTML = `<div class="card"><h3>${runs.length} lần chạy gần nhất</h3><div id="ks-hist-list"></div></div>`;
  panel.querySelector("#ks-hist-list").innerHTML = runs.map((run, i) => {
    const ok = run.results.filter((r) => r.pass).length;
    const total = run.results.length;
    const when = new Date(run.at).toLocaleString("vi-VN");
    return `
      <details class="hist-log" ${i === 0 ? "open" : ""}>
        <summary>${esc(when)} — phạm vi <strong>${esc(run.scope)}</strong> — ${ok}/${total} đạt
          <span class="pill ${ok === total ? "ok" : "warn"}">${ok}/${total}</span></summary>
        ${historyBarsChart(run.results, thrByCode)}
        ${renderRunSummary(run.results)}
      </details>`;
  }).join("");
}

function historyBarsChart(results, thrByCode) {
  const bars = results.map((r) => {
    const cat = thrByCode.get(r.test_id);
    const thrNum = cat ? (Array.isArray(cat.threshold) ? cat.threshold[1] : Number(cat.threshold)) : NaN;
    const pct = Number.isFinite(thrNum) && thrNum ? Math.max(4, Math.min(100, (Number(r.value) / thrNum) * 100)) : 50;
    return `<div class="hist-bar"><i class="${r.pass ? "" : "fail"}" style="height:${pct.toFixed(0)}%"></i><span>${esc(r.test_id.replace("R-", ""))}</span></div>`;
  }).join("");
  return bars ? `<div class="hist-bars">${bars}</div><p class="hint">Chiều cao cột = % so với ngưỡng (100% = vừa chạm ngưỡng).</p>` : "";
}
