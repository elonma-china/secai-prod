apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: {{ include "secai.namespace" . }} }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
          ports: [{ containerPort: {{ .Values.redis.port }} }]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: {{ include "secai.namespace" . }} }
spec:
  selector: { app: redis }
  ports: [{ port: {{ .Values.redis.port }}, targetPort: {{ .Values.redis.port }} }]
