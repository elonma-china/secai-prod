# ═══════════════════════════════════════════════════════════════════════════════
#  deploy/docker-compose.yml — bộ Docker THỐNG NHẤT cho secai-agent-gateway, giờ
#  SỐNG TRONG chính repo gateway (trước đây là secai-docker/, sibling dir riêng —
#  bản gốc đó vẫn được giữ lại làm rollback/tài liệu, xem secai-docker/README.md).
#
#  Gộp BE gateway + Qdrant + Neo4j + Redis vào 1 compose project (network nội bộ
#  `secai-net`), đấu nối qua TÊN SERVICE (không còn localhost). Model LLM/embedding/
#  reranker VẪN gọi ra vast qua HTTP — cấu hình trong .env (không commit; copy từ
#  .env.example hoặc từ secai-docker/.env khi cutover).
#
#  KPI bench (KPI-VA-GEN-TEST/) giờ ĐÓNG GÓI SẴN vào image tại /app/kpi_bench —
#  KHÔNG còn bind-mount thư mục đó từ host (xem Dockerfile `COPY kpi_bench`) nên
#  container portable, không cần path host cụ thể cho phần này nữa.
#
#  Data (KB, PoC, exploitdb, hồ sơ nghiệm thu) VẪN dùng BIND-MOUNT thẳng vào dir
#  host sẵn có (không nhân đôi ~20GB+): ${SECAI_DATA_ROOT}, HO-SO-GOC-NGHIEM-THU-AI/,
#  /home/ict/secai-88/source/data (đường dẫn TUYỆT ĐỐI — vị trí file compose này
#  không ảnh hưởng, giữ nguyên portable dù dời deploy/ đi đâu trong repo).
#
#  Dùng:   docker compose -f deploy/docker-compose.yml --env-file deploy/.env build gateway
#     (build image mới — KHÔNG đụng container đang chạy). Xem README.md cùng thư
#     mục này cho quy trình build/smoke-test/cutover đầy đủ.
#
#  ⚠ container_name/tên project GIỮ NGUYÊN giống secai-docker/docker-compose.yml
#  (secai-docker-gateway, secai-docker-qdrant, …) một cách CÓ CHỦ Ý: đây là bản kế
#  thừa được thiết kế để CUTOVER thay thế (không chạy song song) — cùng tên container
#  + cùng named volume (secai-gw-data, secai-redis-data) nghĩa là khi orchestrator
#  quyết định cutover, `up -d` từ file này sẽ NÂNG CẤP tại chỗ (giữ session/sqlite
#  data qua volume), giống một lần đổi `image:` thông thường — KHÔNG PHẢI chạy thêm
#  một bộ song song. VÌ VẬY: KHÔNG được `up`/`down`/`restart` file này cho tới khi
#  đã quyết định cutover — nó thao tác trên ĐÚNG các container tên giống hệt bản
#  đang chạy production. Build (`build gateway`) an toàn vì không đụng container nào.
#
#  Gateway host port mặc định 8140 (coexist với native/legacy :8131 nếu còn chạy).
#  Đổi bằng GATEWAY_HOST_PORT trong .env hoặc: GATEWAY_HOST_PORT=8131 docker compose ... up -d
# ═══════════════════════════════════════════════════════════════════════════════
name: secai-docker

services:
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: secai-docker-qdrant
    restart: unless-stopped
    ulimits:                               # large collection opens many RocksDB .sst files
      nofile: { soft: 262144, hard: 262144 }
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ${SECAI_DATA_ROOT}/_state/qdrant_storage:/qdrant/storage
      - ${SECAI_DATA_ROOT}/qdrant:/qdrant/snapshots     # rw: Qdrant dọn snapshots/tmp lúc khởi động
    networks: [secai-net]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  neo4j:
    image: neo4j:5.20-community
    container_name: secai-docker-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-secai2026}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2g
    volumes:
      - ${SECAI_DATA_ROOT}/_state/neo4j_data:/data
      - ${SECAI_DATA_ROOT}/_state/neo4j_logs:/logs
    networks: [secai-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: secai-docker-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - secai-redis-data:/data
    networks: [secai-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  gateway:
    # Consolidated build (2026-09-19): source of truth is THIS repo (secai-agent-gateway),
    # context resolves to the gateway root (one level up from deploy/). KPI bench code is
    # baked into the image (COPY kpi_bench ./kpi_bench in the Dockerfile) — no more host
    # bind-mount of KPI-VA-GEN-TEST needed for group B/C live runs.
    build:
      context: ..
      dockerfile: Dockerfile
    image: secai-agent-gateway:0.6.0-consolidated
    container_name: secai-docker-gateway
    restart: unless-stopped
    # Cho container phân giải host.docker.internal → IP host (để reverse-proxy /tb tới TensorBoard :6006 trên host).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    # Re-pin path + service-name settings to in-container values so host-oriented
    # values in .env can never leak into the container.
    environment:
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379
      GATEWAY_DB_PATH: /app/data/gateway.db
      # ── Bộ nhớ hội thoại (feat/session): SQLite bền, hết TTL 24h. sessions.db nằm trong
      # volume secai-gw-data (/app/data) → sống qua restart/recreate. Muốn giữ hành vi cũ
      # (Redis, thread reset 24h) thì đổi SESSION_STORE_BACKEND: redis.
      SESSION_STORE_BACKEND: sqlite
      SESSION_DB_PATH: /app/data/sessions.db
      EXPLOITDB_ROOT: /srv/exploitdb
      POC_CATALOG_DB: /srv/poc/catalog.db
      POC_ARTIFACT_STORE: /srv/poc-store
      POC_SOURCES_ROOT: /srv/poc-sources
      INPUT_CLASSIFIER_ENABLED: "true"           # classifier BẬT (giữ chặn injection/PII)
      INPUT_CLASSIFIER_BLOCK_OFFTOPIC: "false"   # KHÔNG chặn offtopic → câu hỏi hệ thống/meta xuống LLM tự trả lời (hoặc "không biết"); tránh over-refusal — 2026-09-03
      ELASTICSEARCH_URL: http://elasticsearch:9200   # activity log (service-name nội bộ)
      # ── Showcase nghiệm thu (/showcase-demo/ + /ai/finetune|model-info|kpi-bench|evidence|kb|deploy).
      # Đường dẫn host mặc định trong config.py không tồn tại trong container → trỏ lại paths được mount.
      SHOWCASE_HOSOGOC_DIR: /srv/showcase/hosogoc
      SHOWCASE_FINETUNE_DOSSIER_DIR: /srv/showcase/hosogoc/01. Ho_so_huan_luyen/finetuning
      SHOWCASE_FINETUNE_SOURCE_DIR: /srv/showcase/hosogoc/01. Ho_so_huan_luyen
      SHOWCASE_KPI_RESULTS_DIR: /srv/showcase/hosogoc/03. Kpi_results
      SHOWCASE_FT_BUILD_DIR: /srv/showcase/hosogoc/02. Bo_build_finetuning
      SHOWCASE_SANITIZER_DETECTOR: /srv/showcase/hosogoc/03. Kpi_results/Santization/Evaluation_code/detector.py
      SHOWCASE_EVIDENCE_DIR: /app/evidence
      SHOWCASE_HELM_DIR: /app/deploy/helm/secai-gateway
      SHOWCASE_HARDWARE_CHECK: /srv/showcase/hardware-check.json
      SHOWCASE_KB_SYNC_LOG: /srv/showcase/sync_cve.log
      SHOWCASE_DOCKER_COMPOSE: /srv/showcase/docker-compose.yml
      SHOWCASE_KPI_LOG: /app/data/kpi-bench-live.log            # ghi vào volume (writable)
      # TensorBoard đi ké qua chính gateway (:8131) — khách xem same-origin, KHÔNG cần mở cổng/CF/ZT.
      # Link tương đối /showcase-tb; gateway reverse-proxy /showcase-tb/* tới TB trên HOST qua
      # host.docker.internal:6006 (TB chạy với --path_prefix=/showcase-tb). Cùng tiền tố /showcase
      # với trang + API nên FE chỉ cần proxy một dòng /showcase.
      SHOWCASE_TENSORBOARD_BASE_URL: /showcase-tb
      SHOWCASE_TENSORBOARD_UPSTREAM: http://host.docker.internal:6006
      # Service kích hoạt MLOps (trigger_api) chạy trên HOST :8877 — gateway reverse-proxy
      # /showcase-api/retraining/* tới đây (tab "Retraining tự động" của trang nghiệm thu).
      SHOWCASE_RETRAINING_UPSTREAM: http://host.docker.internal:8877
      # Nếu trigger_api bật Basic Auth (khi expose ra internet), khai cùng "user:pass" ở đây để
      # proxy tự thêm Authorization: Basic. Để trống nếu Basic Auth tắt. Đọc từ .env, KHÔNG hardcode.
      SHOWCASE_RETRAINING_BASIC_AUTH: ${SHOWCASE_RETRAINING_BASIC_AUTH:-}
      # ── KPI Studio Live-run: kpi_bench giờ NẰM TRONG IMAGE (/app/kpi_bench), không phải mount
      # host nữa — pin path in-container tường minh (khớp default trong config.py + Dockerfile COPY).
      KPI_BENCH_SCRIPTS_DIR: /app/kpi_bench
      KPI_BENCH_TESTSET_DIR: /app/kpi_bench/02-GEN-TEST/testset-v2
    ports:
      - "${GATEWAY_HOST_PORT:-8140}:8131"
    volumes:
      - secai-gw-data:/app/data                                     # sessions/ledger (writable)
      - ${SECAI_DATA_ROOT}/exploitdb:/srv/exploitdb:ro              # searchsploit corpus
      - ${SECAI_DATA_ROOT}/poc:/srv/poc                             # catalog.db (WAL → rw)
      - ${SECAI_DATA_ROOT}/poc/store:/srv/poc-store                 # fetched PoC artifacts
      - ${SECAI_DATA_ROOT}/poc-sources:/srv/poc-sources:ro          # cloned PoC sources (12GB)
      # ── Showcase (read-only): SPA + evidence + helm baked-in bị Dockerfile bỏ qua → bind từ host.
      - /home/ict/AIEngines/secai/secai-agent-gateway/demo:/app/demo:ro                 # trang SPA showcase
      - /home/ict/AIEngines/secai/secai-agent-gateway/evidence:/app/evidence:ro         # evidence dong-N.md
      - /home/ict/AIEngines/secai/secai-agent-gateway/deploy/helm:/app/deploy/helm:ro   # Helm chart (tab Triển khai)
      - /home/ict/AIEngines/secai/secai-agent-gateway/data/hardware-check.json:/srv/showcase/hardware-check.json:ro
      - /home/ict/AIEngines/secai/HO-SO-GOC-NGHIEM-THU-AI:/srv/showcase/hosogoc:ro      # hồ sơ gốc (dossier+KPI+build)
      - /home/ict/Downloads/CVE-DB/sync_cve.log:/srv/showcase/sync_cve.log:ro           # log cập nhật KB
      - /home/ict/AIEngines/secai/secai-docker/docker-compose.yml:/srv/showcase/docker-compose.yml:ro
      # BM25 index cho retrieval nhóm A (group A vẫn chỉ chạy được trên HOST, không trong
      # container này — cần runs/ ghi-được cục bộ + .env.bench thật, xem README.md cùng thư
      # mục này; hành vi này KHÔNG đổi so với secai-docker/docker-compose.yml trước đây).
      - /home/ict/secai-88/source/data:/home/ict/secai-88/source/data:ro
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [secai-net]

  # Activity log store cho /logs (ghi log hội thoại AI: ai hỏi gì, lúc nào, từ IP nào,
  # chức năng nào, mất bao lâu). Chỉ phục vụ nội bộ secai-net + loopback host để debug —
  # KHÔNG mở ra 0.0.0.0 vì log chứa nội dung hội thoại nguyên văn.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: secai-docker-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Tắt security: ES không expose ra ngoài (chỉ secai-net + 127.0.0.1), giữ cấu hình đơn
      # giản. Bật lại bằng xpack.security.enabled=true + ELASTICSEARCH_USERNAME/PASSWORD ở
      # gateway nếu sau này cần.
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"     # máy có 93GB khả dụng; 2g dư cho khối lượng log này
      bootstrap.memory_lock: "true"
      cluster.routing.allocation.disk.watermark.low: "92%"
      cluster.routing.allocation.disk.watermark.high: "95%"
      cluster.routing.allocation.disk.watermark.flood_stage: "97%"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - ${SECAI_DATA_ROOT}/_state/elasticsearch:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"           # CHỈ loopback — không để lộ log ra mạng ngoài
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [secai-net]

networks:
  secai-net:
    driver: bridge

volumes:
  secai-gw-data:
  secai-redis-data:
