# ═══════════════════════════════════════════════════════════════════════════════
#  secai-docker — bộ Docker THỐNG NHẤT cho project SecAI/AIEngines (core stack).
#
#  Gộp BE gateway + Qdrant + Neo4j + Redis vào 1 compose project (network nội bộ
#  `secai-net`), đấu nối qua TÊN SERVICE (không còn localhost). Model LLM/embedding/
#  reranker VẪN gọi ra vast (23.127.144.217) qua HTTP — cấu hình trong .env.
#
#  Data dùng BIND-MOUNT thẳng vào dir local sẵn có (không nhân đôi ~20GB+):
#     /home/ict/AIEngines/secai/secai-data/...
#
#  Dùng:   ./up.sh            (khuyến nghị — dừng stack cũ, build, up, in danh sách)
#     hoặc: docker compose --env-file .env up -d --build
#
#  Gateway host port mặc định 8140 (coexist với native ias.id.vn :8131). Đổi bằng
#  GATEWAY_HOST_PORT trong .env hoặc: GATEWAY_HOST_PORT=8131 docker compose up -d
# ═══════════════════════════════════════════════════════════════════════════════
name: secai-docker

services:
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: secai-docker-qdrant
    restart: unless-stopped
    ulimits:                               # large collection opens many RocksDB .sst files
      nofile: { soft: 262144, hard: 262144 }
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ${SECAI_DATA_ROOT}/_state/qdrant_storage:/qdrant/storage
      - ${SECAI_DATA_ROOT}/qdrant:/qdrant/snapshots     # rw: Qdrant dọn snapshots/tmp lúc khởi động
    networks: [secai-net]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  neo4j:
    image: neo4j:5.20-community
    container_name: secai-docker-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-secai2026}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2g
    volumes:
      - ${SECAI_DATA_ROOT}/_state/neo4j_data:/data
      - ${SECAI_DATA_ROOT}/_state/neo4j_logs:/logs
    networks: [secai-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: secai-docker-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - secai-redis-data:/data
    networks: [secai-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  gateway:
    # Image REPRODUCIBLE (2026-09-04): two-scopes DA GIAI QUYET — nhanh feat/chat-harness-optimize
    # (@3c05a04) hop nhat classifier + exploit-advance + chat-opt. `docker compose build gateway`
    # tu ../secai-agent-gateway tai tao image day du (classifier + guard + /ai/exploit + /ai/translate).
    build:
      context: ../secai-agent-gateway
      dockerfile: Dockerfile
    # 0.4.0-session (feat/session): + project/session mgmt + durable SQLite session store
    # (SESSION_STORE_BACKEND=sqlite, sessions.db trong volume secai-gw-data). Ảnh cũ
    # 0.3.0-merged giữ nguyên để rollback (đổi lại image: + `docker compose up -d gateway`).
    # 0.5.2-chat-grounding (2026-09-19, commit 69553fe): pre-fetch KB grounding cho câu
    # hỏi có CVE/CWE/CAPEC/ATT&CK-id ở /ai/chat[/stream] + /sessions/{sid}/chat[/stream] —
    # fix 46.9% câu trả lời không gọi tool → model bịa nhầm CVE (đo faithfulness 58-63%
    # trước fix). Ảnh 0.5.1-kpi-live giữ nguyên để rollback.
    # 0.5.3-faith-tune (2026-09-20): faithfulness sau 0.5.2 đo được 88.63% (n=834/850),
    # phân tích 4 pattern lỗi còn sót → 2 fix product: (a) top_k 5→10 trong
    # _ground_chat_prompt() — EXACT-CVE FAST PATH của _qdrant_search scroll rồi cắt cứng
    # top_k, CVE nhiều chunk có thể rớt mất chunk "context" (chứa KEV/severity) ngẫu
    # nhiên; (b) prompts/chat.md grounding_and_honesty thêm rule chặn suy diễn văn xuôi
    # vượt context (chuỗi tấn công/kịch bản khai thác/tác động kinh doanh không có
    # trong KB) — pattern lỗi lớn nhất còn lại (121/850). Ảnh 0.5.2-chat-grounding giữ
    # nguyên để rollback.
    # 0.5.4-source-sse (2026-09-21): FE (ToolTimeline.tsx) đã wire đúng onToolCall/
    # onToolResult nhưng không hiện "nguồn" vì _ground_chat_prompt() (0.5.2) pre-fetch
    # KB thay hẳn việc model tự gọi tool → không còn tool_call/tool_result SSE event
    # nào phát ra dù answer vẫn có grounding thật. Fix: dựng cặp tool_call/tool_result
    # giả lập từ kết quả pre-fetch (api/routes.py _grounding_sse_frames, stream()
    # pre_frames param) — /ai/chat[/stream] + /sessions/{sid}/chat[/stream] đều có.
    # Ảnh 0.5.3-faith-tune giữ nguyên để rollback.
    # 0.5.5-regen-fix (2026-09-21): bug thật do 0.5.2 gây ra — RequireChatGroundingHook.
    # on_before_final_answer chỉ coi "đã tra KB" qua tool_result thật (on_post_tool_use);
    # pre-fetch của _ground_chat_prompt() gọi _qdrant_search() thẳng, không qua tool-call
    # nên hook không biết, ép force_continue (regenerate) 2 LẦN/câu dù context đã đúng —
    # user báo "gen gần xong thì giật, sinh lại" (đúng UI hành vi clear buffer khi nhận
    # regenerate). Xác nhận live: CVE-2021-44228/CVE-2026-53963 đều 2 regenerate trước
    # fix, 0 sau fix — 2-3x lãng phí compute mỗi câu, và có rủi ro hết max_retries thì
    # SHIP _CHAT_EMPTY_FALLBACK đè lên câu trả lời pre-fetch vốn đã đúng. Fix: marker
    # CHAT_PRE_FETCH_MARKER (agent/hooks.py) chèn đầu prompt khi pre-fetch, hook check
    # prompt.startswith(marker) → coi need_kb=False, bỏ qua force_continue cho nhánh đó.
    # Ảnh 0.5.4-source-sse giữ nguyên để rollback.
    # 0.5.6-poc-drilldown (2026-09-21, commits 8a484ee/63d1a15/45f1e70): (1) chat +poc_fetch
    # để drill-down PoC trả mã thật thay vì bịa/link (airgap); (2) classifier margin guard
    # chống chặn nhầm câu drill-down là off-topic; (3) đo duration_ms thật cho event pre-fetch
    # qdrant_search. Build từ working tree (giữ statistical feature + rate-limit 150) NHƯNG đã
    # BỎ đoạn TEMP TRACE debug (log body /ai/*). Ảnh 0.5.5-regen-fix giữ nguyên để rollback.
    # 0.5.7-chat-leak-fix (2026-09-21, commit 475871c): hết rò rỉ prompt nội bộ (env+grounding
    # KB dump) vào lịch sử chat — EphemeralTurnContextHook (linch build_context) đưa context cho
    # model KHÔNG persist + session.run prompt gốc + _display_message_dict che turn cũ. Faithfulness
    # matched-eval Δ≈0 (23.84 vs baseline 24.25, judge deepseek-v4.1-flash n=30) → không regress.
    # Vẫn giữ statistical feature + rate-limit 150, KHÔNG có TEMP TRACE. Ảnh 0.5.6-poc-drilldown
    # giữ nguyên để rollback.
    # 0.5.8-qa-batch (2026-09-22): batch 12 fix từ QA report api-quality-safety-2026-09-21 (13 commit
    # e4330e9..cd1bf83): #1 relevance-gate, #2 target-redact+disclaimer, #3/#4 translate lang+injection,
    # #5 remediation secure-by-default, #6/#14c exploit metadata grounding+candidate_status, #7 stub-filter,
    # #8 OWASP version-agnostic, #9/#14b translate 5xx-empty+lang-allowlist, #12 glossary, #13 hide
    # tool_registry, #14a chat explicit-lang (partial). Build từ working tree (statistical + rate-limit 150),
    # BỎ TEMP TRACE. Ảnh 0.5.7-chat-leak-fix giữ nguyên để ROLLBACK.
    # 0.5.9-hardening-regfix (2026-09-22): + hardening H1/H2/H3 (ad454cb: cwe_refs metadata exploit,
    # redact metadata.sources citation-only, shrink SSE tool_result giữ ToolTimeline) + FIX REGRESSION
    # (d32f3e0: câu OWASP/CWE-Top-N hết bị trả "Cảm ơn... ngày tháng" — bọc marker ephemeral date/grounding
    # + bỏ dòng tool_routing stale). Live 0/36 regression, #11 leak nguyên. Ảnh 0.5.8-qa-batch giữ ROLLBACK.
    # 0.5.10-chat-giat-fix (2026-09-26, 877d469): fix chatbot GIẬT phía BE — 🅱1 RequireChatGroundingHook
    # max_retries 3→1 (khớp linch cap, hết SSE regenerate "giả" ship draft cũ); 🅲 _filter_display_rows
    # (api/projects.py) lọc retry-tail <system-reminder> + draft reject khỏi GET /messages (hết leak/giật
    # refetch); gỡ comment "hook INERT" sai. (FE giật-fix a646741 riêng ở secai-fe-devspace, không qua image.)
    # Residual flag: text persist store ≠ floor SSE (reload có thể thấy bịa). Ảnh 0.5.9-hardening-regfix ROLLBACK.
    # 0.5.11-chat-grounding-retry (2026-09-27, f44e593): fix nhóm câu grounding-retry (hết xin lỗi/swap +
    # live==store). Lớp1 (routes.py): pre-fetch KB cho follow-up không kèm ID ("có CVE nào?" resolve entity
    # từ history). Lớp2 (hooks.py): nới missing_web khi web_fetch_enabled=False (airgap) → Top-N OWASP/CWE
    # trả từ kiến thức+disclaimer thay vì bị ép regen→xin lỗi. GIỮ KB enforce. Ảnh 0.5.10-chat-giat-fix ROLLBACK.
    # 0.5.12-topn-year-fix (2026-09-27, eb76d3c): hết bịa năm khi hỏi Top-N không ghi năm (residual #8) —
    # chat.md versioned_list_policy thêm rule case không-nêu-năm (cấm gán năm trừ khi web_fetch thành công) +
    # base_system.md URL 2025 chỉ là đích fetch không phải nhãn. Live 80%→0% bịa năm. Ảnh 0.5.11 ROLLBACK.
    # 0.5.13-classifier-topn (2026-09-27, 957360d): hết classifier chặn nhầm câu security Top-N (bare
    # taxonomy+Top-N off_p=0.98) là off-topic — sanitize/gate.py security_marker guard (CWE|CVE|CAPEC|CVSS|
    # OWASP|SANS|ATT&CK|MITRE) ở nhánh offtopic; injection intact. Rollback flag input_classifier_security_
    # marker_override. TRADEOFF low-stakes: decoy sáng-tạo nhắc taxonomy dựa scope_policy. Ảnh 0.5.12 ROLLBACK.
    image: secai-agent-gateway:0.5.13-classifier-topn
    container_name: secai-docker-gateway
    restart: unless-stopped
    # Cho container phân giải host.docker.internal → IP host (để reverse-proxy /tb tới TensorBoard :6006 trên host).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    # Re-pin path + service-name settings to in-container values so host-oriented
    # values in .env can never leak into the container.
    environment:
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379
      GATEWAY_DB_PATH: /app/data/gateway.db
      # ── Bộ nhớ hội thoại (feat/session): SQLite bền, hết TTL 24h. sessions.db nằm trong
      # volume secai-gw-data (/app/data) → sống qua restart/recreate. Muốn giữ hành vi cũ
      # (Redis, thread reset 24h) thì đổi SESSION_STORE_BACKEND: redis.
      SESSION_STORE_BACKEND: sqlite
      SESSION_DB_PATH: /app/data/sessions.db
      EXPLOITDB_ROOT: /srv/exploitdb
      POC_CATALOG_DB: /srv/poc/catalog.db
      POC_ARTIFACT_STORE: /srv/poc-store
      POC_SOURCES_ROOT: /srv/poc-sources
      INPUT_CLASSIFIER_ENABLED: "true"           # classifier BẬT (giữ chặn injection/PII)
      INPUT_CLASSIFIER_BLOCK_OFFTOPIC: "false"   # KHÔNG chặn offtopic → câu hỏi hệ thống/meta xuống LLM tự trả lời (hoặc "không biết"); tránh over-refusal — 2026-09-03
      ELASTICSEARCH_URL: http://elasticsearch:9200   # activity log (service-name nội bộ)
      # ── Showcase nghiệm thu (/showcase-demo/ + /ai/finetune|model-info|kpi-bench|evidence|kb|deploy).
      # Đường dẫn host mặc định trong config.py không tồn tại trong container → trỏ lại paths được mount.
      SHOWCASE_HOSOGOC_DIR: /srv/showcase/hosogoc
      SHOWCASE_FINETUNE_DOSSIER_DIR: /srv/showcase/hosogoc/01. Ho_so_huan_luyen/finetuning
      SHOWCASE_FINETUNE_SOURCE_DIR: /srv/showcase/hosogoc/01. Ho_so_huan_luyen
      SHOWCASE_KPI_RESULTS_DIR: /srv/showcase/hosogoc/03. Kpi_results
      SHOWCASE_FT_BUILD_DIR: /srv/showcase/hosogoc/02. Bo_build_finetuning
      SHOWCASE_SANITIZER_DETECTOR: /srv/showcase/hosogoc/03. Kpi_results/Santization/Evaluation_code/detector.py
      SHOWCASE_EVIDENCE_DIR: /app/evidence
      SHOWCASE_HELM_DIR: /app/deploy/helm/secai-gateway
      SHOWCASE_HARDWARE_CHECK: /srv/showcase/hardware-check.json
      SHOWCASE_KB_SYNC_LOG: /srv/showcase/sync_cve.log
      SHOWCASE_DOCKER_COMPOSE: /srv/showcase/docker-compose.yml
      SHOWCASE_KPI_LOG: /app/data/kpi-bench-live.log            # ghi vào volume (writable)
      # TensorBoard đi ké qua chính gateway (:8131) — khách xem same-origin, KHÔNG cần mở cổng/CF/ZT.
      # Link tương đối /showcase-tb; gateway reverse-proxy /showcase-tb/* tới TB trên HOST qua
      # host.docker.internal:6006 (TB chạy với --path_prefix=/showcase-tb). Cùng tiền tố /showcase
      # với trang + API nên FE chỉ cần proxy một dòng /showcase.
      SHOWCASE_TENSORBOARD_BASE_URL: /showcase-tb
      SHOWCASE_TENSORBOARD_UPSTREAM: http://host.docker.internal:6006
      # Service kích hoạt MLOps (trigger_api) chạy trên HOST :8877 — gateway reverse-proxy
      # /showcase-api/retraining/* tới đây (tab "Retraining tự động" của trang nghiệm thu).
      SHOWCASE_RETRAINING_UPSTREAM: http://host.docker.internal:8877
      # Nếu trigger_api bật Basic Auth (khi expose ra internet), khai cùng "user:pass" ở đây để
      # proxy tự thêm Authorization: Basic. Để trống nếu Basic Auth tắt. Đọc từ .env, KHÔNG hardcode.
      SHOWCASE_RETRAINING_BASIC_AUTH: ${SHOWCASE_RETRAINING_BASIC_AUTH:-}
    ports:
      - "${GATEWAY_HOST_PORT:-8140}:8131"
    volumes:
      - secai-gw-data:/app/data                                     # sessions/ledger (writable)
      - ${SECAI_DATA_ROOT}/exploitdb:/srv/exploitdb:ro              # searchsploit corpus
      - ${SECAI_DATA_ROOT}/poc:/srv/poc                             # catalog.db (WAL → rw)
      - ${SECAI_DATA_ROOT}/poc/store:/srv/poc-store                 # fetched PoC artifacts
      - ${SECAI_DATA_ROOT}/poc-sources:/srv/poc-sources:ro          # cloned PoC sources (12GB)
      # ── Showcase (read-only): SPA + evidence + helm baked-in bị Dockerfile bỏ qua → bind từ host.
      - /home/ict/AIEngines/secai/secai-agent-gateway/demo:/app/demo:ro                 # trang SPA showcase
      - /home/ict/AIEngines/secai/secai-agent-gateway/evidence:/app/evidence:ro         # evidence dong-N.md
      - /home/ict/AIEngines/secai/secai-agent-gateway/deploy/helm:/app/deploy/helm:ro   # Helm chart (tab Triển khai)
      - /home/ict/AIEngines/secai/secai-agent-gateway/data/hardware-check.json:/srv/showcase/hardware-check.json:ro
      - /home/ict/AIEngines/secai/HO-SO-GOC-NGHIEM-THU-AI:/srv/showcase/hosogoc:ro      # hồ sơ gốc (dossier+KPI+build)
      - /home/ict/Downloads/CVE-DB/sync_cve.log:/srv/showcase/sync_cve.log:ro           # log cập nhật KB
      - /home/ict/AIEngines/secai/secai-docker/docker-compose.yml:/srv/showcase/docker-compose.yml:ro
      # KPI Studio Live-run: script bench 19 KPI (B/C: bench_kpi.py; A: chay_eval_gateway_moi.sh) +
      # BM25 index cho retrieval nhóm A. RO: B/C ghi --out ra /tmp (writable); nhóm A ghi runs/
      # cần rw nên chỉ chạy được trên HOST, không trong container này (xem README).
      - /home/ict/AIEngines/secai/KPI-VA-GEN-TEST:/home/ict/AIEngines/secai/KPI-VA-GEN-TEST:ro
      - /home/ict/secai-88/source/data:/home/ict/secai-88/source/data:ro
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [secai-net]

  # Activity log store cho /logs (ghi log hội thoại AI: ai hỏi gì, lúc nào, từ IP nào,
  # chức năng nào, mất bao lâu). Chỉ phục vụ nội bộ secai-net + loopback host để debug —
  # KHÔNG mở ra 0.0.0.0 vì log chứa nội dung hội thoại nguyên văn.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: secai-docker-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Tắt security: ES không expose ra ngoài (chỉ secai-net + 127.0.0.1), giữ cấu hình đơn
      # giản. Bật lại bằng xpack.security.enabled=true + ELASTICSEARCH_USERNAME/PASSWORD ở
      # gateway nếu sau này cần.
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"     # máy có 93GB khả dụng; 2g dư cho khối lượng log này
      bootstrap.memory_lock: "true"
      cluster.routing.allocation.disk.watermark.low: "92%"
      cluster.routing.allocation.disk.watermark.high: "95%"
      cluster.routing.allocation.disk.watermark.flood_stage: "97%"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - ${SECAI_DATA_ROOT}/_state/elasticsearch:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"           # CHỈ loopback — không để lộ log ra mạng ngoài
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [secai-net]

networks:
  secai-net:
    driver: bridge

volumes:
  secai-gw-data:
  secai-redis-data:
