# Declarative profile registry — the single source of truth for per-endpoint behaviour.
#   prompt     : markdown file in this folder holding the profile's system prompt
#   tools      : tool names the agent may call in this profile (enforced per session)
#   base       : prepend the shared base_system.md? false = pure text-transform, no tools/RAG
#   max_turns  : agent loop cap for this profile
chat:
  prompt: chat.md
  tools: [qdrant_search, neo4j_search, poc_search]
  base: true
  max_turns: 10

exploit_research:
  prompt: exploit.md
  tools: [qdrant_search, neo4j_search, poc_search, poc_fetch]
  base: true
  max_turns: 12

# Uncertain-band cascade judge (sanitize/cascade.py): decides injection-vs-legit-security-
# question for chat messages whose classifier score falls in the calibrated uncertain band.
# No tools — pure text-in, JSON-out; never sees anything beyond the one message + its score.
injection_judge:
  prompt: injection_judge.md
  tools: []
  base: false
  max_turns: 2

# Single-shot conversation auto-title (api/routes.py::_maybe_autotitle): summarizes the first
# Q&A pair of a new /ai/conversations/* thread into a short display title. Runs in the
# background after the first turn — never blocks the chat response. No tools, pure text→text.
conversation_title:
  prompt: conversation_title.md
  tools: []
  base: false
  max_turns: 2

translate:
  prompt: translate.md
  tools: []
  base: false
  max_turns: 2

report:
  prompt: report.md
  tools: [qdrant_search, neo4j_search]
  base: false
  max_turns: 6

statistical_report:
  prompt: statistical.md
  tools: [qdrant_search, neo4j_search]
  base: false
  max_turns: 6
