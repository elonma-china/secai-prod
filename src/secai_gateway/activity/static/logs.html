<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhật ký hoạt động AI — SecAI Gateway</title>
<style>
  /* Vanilla only: this page ships inside the gateway image and must render on a host with
     no internet access, so there are no external fonts, icons or scripts. */
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --ink: #111820; --muted: #5d6b7a; --line: #e2e7ec;
    --accent: #1f6feb; --accent-soft: #e8f0fe;
    --ok: #146c43; --err: #b42318; --warn: #b45309;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 6px 16px rgba(16,24,40,.08);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1319; --panel: #161c24; --ink: #e6edf3; --muted: #92a0b0; --line: #263039;
      --accent: #4d94ff; --accent-soft: #16283f;
      --ok: #3fb27f; --err: #f2726a; --warn: #e0a03a;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--ink);
         font-size: 14px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ── login ─────────────────────────────────────────────────────────────── */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  #login form { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
                padding: 28px; width: min(380px, 100%); box-shadow: var(--shadow); }
  #login h1 { margin: 0 0 4px; font-size: 19px; }
  #login p { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
  .field { display: block; margin-bottom: 14px; }
  .field span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input { width: 100%; padding: 10px 12px; border: 1px solid var(--line);
                 border-radius: 9px; background: var(--bg); }
  .btn { border: 1px solid transparent; border-radius: 9px; padding: 9px 14px;
         background: var(--accent); color: #fff; font-weight: 600; }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--ink);
               font-weight: 500; }
  .btn.ghost.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; }
  .err { color: var(--err); font-size: 13px; min-height: 18px; margin-top: 10px; }

  /* ── shell ─────────────────────────────────────────────────────────────── */
  #app { display: none; }
  /* Exactly one viewport tall (not min-height): that is what bounds .table-wrap so the rows
     scroll INSIDE it and the filter bar + pager stay pinned. With min-height the page grew
     with the row count and the pager ended up below the fold. */
  #app.on { display: grid; grid-template-columns: auto 1fr; height: 100vh; overflow: hidden; }

  aside { width: 236px; background: var(--panel); border-right: 1px solid var(--line);
          padding: 14px 12px; display: flex; flex-direction: column; gap: 18px;
          transition: width .18s ease; overflow: hidden auto; }
  aside.collapsed { width: 58px; }
  /* Collapsed = "give the table the full width". The filter buttons are meaningless
     without their labels (and a column of label-less pills or bare counts reads as
     noise), so the whole nav goes away and only the toggle stays. */
  aside.collapsed .lbl, aside.collapsed .group, aside.collapsed .side-foot { display: none; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .brand .dot { width: 26px; height: 26px; border-radius: 8px; background: var(--accent);
                color: #fff; display: grid; place-items: center; font-size: 13px; flex: none; }
  .group h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
              color: var(--muted); font-weight: 600; }
  .side-btn { width: 100%; display: flex; align-items: center; gap: 9px; padding: 7px 9px;
              border-radius: 8px; border: 1px solid transparent; background: transparent;
              text-align: left; color: var(--ink); }
  .side-btn:hover { background: var(--bg); }
  .side-btn.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .side-btn .count { margin-left: auto; font-size: 11px; color: var(--muted);
                     font-variant-numeric: tabular-nums; }
  .side-btn.active .count { color: var(--accent); }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .bar { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px;
         display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .bar input[type="datetime-local"], .bar input[type="search"], .bar select {
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .bar input[type="search"] { flex: 1; min-width: 190px; }
  .sep { width: 1px; height: 26px; background: var(--line); }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .live-dot.on { animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  @media (prefers-reduced-motion: reduce) { .live-dot.on { animation: none } }

  .meta-line { padding: 8px 16px; color: var(--muted); font-size: 12.5px;
               border-bottom: 1px solid var(--line); display: flex; gap: 14px; flex-wrap: wrap; }

  .table-wrap { flex: 1; overflow: auto; }
  /* Fixed layout with explicit widths: the question preview then takes whatever is left
     instead of pushing the table wider than the viewport and clipping itself off-screen. */
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  /* "Máy chủ" is deliberately not a column: it is the same value on every row of a
     single-gateway deployment, so it only stole width from the two columns people
     actually read. It is still in the detail panel, where it matters. */
  th:nth-child(1), td:nth-child(1) { width: 150px; }   /* thời gian */
  th:nth-child(2), td:nth-child(2) { width: 130px; }   /* chức năng */
  th:nth-child(3), td:nth-child(3) { width: 120px; }   /* người dùng */
  th:nth-child(4), td:nth-child(4) { width: 116px; }   /* IP */
  th:nth-child(5), td:nth-child(5) { width: 94px; }    /* thời lượng */
  th:nth-child(6), td:nth-child(6) { width: 88px; }    /* trạng thái */
  /* câu hỏi + phản hồi chia đôi phần còn lại */
  td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  th { position: sticky; top: 0; background: var(--panel); text-align: left; font-size: 11.5px;
       letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
       padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; z-index: 1; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--panel); }
  tbody tr.fresh { animation: flash 2s ease-out; }
  @keyframes flash { from { background: var(--accent-soft) } to { background: transparent } }
  .t-time { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
  .t-num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .t-prev { color: var(--muted); }
  .bar-lbl { font-size: 12px; color: var(--muted); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px;
           font-weight: 600; white-space: nowrap; background: var(--accent-soft); color: var(--accent); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11.5px;
          font-weight: 600; }
  .pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .pill.err { color: var(--err); background: color-mix(in srgb, var(--err) 14%, transparent); }
  .pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }

  .state { padding: 40px 16px; text-align: center; color: var(--muted); }
  .t-ans { color: var(--ink); }

  /* pager */
  .pager { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px;
           display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pager .spacer { flex: 1; }
  .pg { border: 1px solid var(--line); background: transparent; border-radius: 8px;
        min-width: 34px; padding: 6px 9px; font-variant-numeric: tabular-nums; }
  .pg:hover:not(:disabled) { background: var(--bg); }
  .pg[aria-current="page"] { background: var(--accent); border-color: var(--accent);
                             color: #fff; font-weight: 600; }
  .pg:disabled { opacity: .4; cursor: default; }
  .pg-info { font-size: 12.5px; color: var(--muted); }
  .pg-gap { color: var(--muted); padding: 0 2px; }
  .pager select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
                  background: var(--bg); }

  /* ── detail drawer ─────────────────────────────────────────────────────── */
  #drawer { position: fixed; inset: 0 0 0 auto; width: min(680px, 100%); background: var(--panel);
            border-left: 1px solid var(--line); box-shadow: var(--shadow); transform: translateX(102%);
            transition: transform .2s ease; display: flex; flex-direction: column; z-index: 20; }
  #drawer.on { transform: none; }
  .dw-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex;
             align-items: center; gap: 10px; }
  .dw-head h2 { margin: 0; font-size: 15px; flex: 1; }
  .dw-body { overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; word-break: break-word; font-family: var(--mono); font-size: 12.5px; }
  .block h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
              color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .block h4 .len { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; }
  /* Long content is the norm here (a full exploit report can be tens of KB), so the body is
     clamped by default and opened on demand rather than pushing everything else off-screen. */
  .content { font-family: var(--mono); font-size: 12.5px; line-height: 1.55; white-space: pre-wrap;
             word-break: break-word; background: var(--bg); border: 1px solid var(--line);
             border-radius: 10px; padding: 12px; max-height: 260px; overflow: auto; }
  .content.open { max-height: none; }
  .mini { border: 1px solid var(--line); background: transparent; border-radius: 7px;
          padding: 3px 9px; font-size: 12px; color: var(--muted); }

  @media (max-width: 860px) {
    aside { position: fixed; z-index: 30; height: 100%; }
    aside.collapsed { width: 0; padding: 0; border: 0; }
    #app.on { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <h1>Nhật ký hoạt động AI</h1>
    <p>Trang này hiển thị nội dung hội thoại. Vui lòng đăng nhập.</p>
    <label class="field"><span>Tài khoản</span><input id="u" autocomplete="username" required></label>
    <label class="field"><span>Mật khẩu</span><input id="p" type="password" autocomplete="current-password" required></label>
    <button class="btn" style="width:100%" type="submit">Đăng nhập</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app">
  <aside id="side">
    <div class="brand">
      <button class="dot" id="toggleSide" title="Thu gọn / mở rộng" aria-label="Thu gọn hoặc mở rộng thanh bên">☰</button>
      <span class="lbl">Nhật ký AI</span>
    </div>

    <div class="group">
      <h3 class="lbl">Chức năng</h3>
      <div id="fnList"></div>
    </div>

    <div class="group">
      <h3 class="lbl">Trạng thái</h3>
      <div id="stList"></div>
    </div>

    <div class="group">
      <h3 class="lbl">Khoảng thời gian</h3>
      <div id="rangeList"></div>
    </div>

    <div class="side-foot">
      <button class="side-btn" id="logout" title="Đăng xuất">⎋ <span class="lbl">Đăng xuất</span></button>
      <span class="lbl" style="font-size:11.5px;color:var(--muted)" id="whoami"></span>
    </div>
  </aside>

  <main>
    <div class="bar">
      <span class="bar-lbl">Từ</span>
      <input type="datetime-local" id="from" title="Từ thời điểm">
      <span class="bar-lbl">đến</span>
      <input type="datetime-local" id="to" title="Đến thời điểm">
      <div class="sep"></div>
      <select id="field" title="Tìm trong trường nào">
        <option value="all">Tất cả</option>
        <option value="question">Câu hỏi</option>
        <option value="answer">Câu trả lời</option>
        <option value="user_id">User ID</option>
        <option value="conversation_id">Conversation ID</option>
        <option value="client_ip">IP</option>
        <option value="request_id">Request ID</option>
        <option value="run_id">Run ID</option>
        <option value="user_agent">User-Agent</option>
        <option value="server_hostname">Tên máy chủ</option>
      </select>
      <input type="search" id="q" placeholder="Tìm kiếm… (gõ không dấu vẫn ra)">
      <button class="btn" id="searchBtn">Tìm</button>
      <div class="sep"></div>
      <button class="btn ghost" id="liveBtn" title="Bật/tắt theo dõi thời gian thực">
        <span class="live-dot" id="liveDot"></span> <span id="liveTxt">Live</span>
      </button>
    </div>

    <div class="meta-line">
      <span id="summary">Đang tải…</span>
      <span id="liveInfo"></span>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Thời gian</th><th>Chức năng</th><th>Người dùng</th><th>IP</th>
          <th class="t-num">Thời lượng</th><th>Trạng thái</th>
          <th>Câu hỏi</th><th>Phản hồi của hệ thống</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="state" id="empty" hidden>Chưa có bản ghi nào khớp bộ lọc.</div>
    </div>

    <nav class="pager" id="pager" aria-label="Phân trang">
      <button class="pg" id="pgFirst" title="Trang đầu">«</button>
      <button class="pg" id="pgPrev" title="Trang trước">‹</button>
      <span id="pgNums" style="display:flex;gap:6px"></span>
      <button class="pg" id="pgNext" title="Trang sau">›</button>
      <button class="pg" id="pgLast" title="Trang cuối">»</button>
      <span class="pg-info" id="pgInfo"></span>
      <span class="spacer"></span>
      <span class="pg-info">Số dòng/trang</span>
      <select id="pgSize">
        <option>25</option><option selected>50</option><option>100</option><option>200</option>
      </select>
    </nav>
  </main>
</div>

<div id="drawer" aria-hidden="true">
  <div class="dw-head">
    <h2 id="dwTitle">Chi tiết</h2>
    <button class="mini" id="dwClose">Đóng ✕</button>
  </div>
  <div class="dw-body" id="dwBody"></div>
</div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const API = "/logs/api";

  const FN_LABEL = {
    chat: "Chat", conversation_chat: "Chat (hội thoại)", translate: "Dịch",
    report: "Báo cáo", statistical_report: "Báo cáo thống kê", exploit: "Khai thác",
  };
  const FN_COLOR = {
    chat: "#1f6feb", conversation_chat: "#0369a1", translate: "#0f766e",
    report: "#7c3aed", statistical_report: "#b45309", exploit: "#be123c",
  };

  const state = { live: false, es: null, cursor: null, fn: "", status: "",
                  page: 1, pages: 1, size: 50, total: 0 };

  // ── helpers ────────────────────────────────────────────────────────────────
  const fmtTime = (iso) => {
    if (!iso) return "";
    const d = new Date(iso);
    return d.toLocaleString("vi-VN", { hour12: false });
  };
  const fmtMs = (v) => (v == null ? "" : v >= 1000 ? (v / 1000).toFixed(1) + " s" : Math.round(v) + " ms");
  const clip = (s, n) => (!s ? "" : s.length <= n ? s : s.slice(0, n) + "…");
  const toIso = (v) => (v ? new Date(v).toISOString() : "");

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;   // textContent everywhere: log content is untrusted
    return n;
  }

  function params(extra) {
    const p = new URLSearchParams();
    const from = toIso($("from").value), to = toIso($("to").value);
    if (from) p.set("date_from", from);
    if (to) p.set("date_to", to);
    const q = $("q").value.trim();
    if (q) { p.set("q", q); p.set("field", $("field").value); }
    if (state.fn) p.set("function", state.fn);
    if (state.status === "blocked") p.set("blocked", "true");
    if (state.status === "error") p.set("error", "true");
    if (state.status === "ok") { p.set("error", "false"); p.set("blocked", "false"); }
    Object.entries(extra || {}).forEach(([k, v]) => v != null && p.set(k, v));
    return p;
  }

  async function api(path, opts) {
    const res = await fetch(path, Object.assign({ credentials: "same-origin" }, opts));
    if (res.status === 401) { showLogin(); throw new Error("unauthorized"); }
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
    return res.json();
  }

  // ── rendering ──────────────────────────────────────────────────────────────
  function statusPill(r) {
    if (r.error) return ["err", "Lỗi"];
    if (r.blocked) return ["warn", "Bị chặn"];
    return ["ok", "OK"];
  }

  function addRow(r, fresh) {
    const tr = el("tr", fresh ? "fresh" : "");
    tr.appendChild(el("td", "t-time", fmtTime(r["@timestamp"])));

    const tdFn = el("td");
    const b = el("span", "badge", FN_LABEL[r.function] || r.function || "—");
    const c = FN_COLOR[r.function];
    if (c) { b.style.color = c; b.style.background = c + "1f"; }
    if (r.stream) b.title = "Streaming (SSE)";
    tdFn.appendChild(b);
    tr.appendChild(tdFn);

    tr.appendChild(el("td", "", r.user_id || "—"));
    tr.appendChild(el("td", "", r.client_ip || "—"));
    tr.appendChild(el("td", "t-num", fmtMs(r.duration_ms)));

    const [cls, label] = statusPill(r);
    const tdSt = el("td");
    tdSt.appendChild(el("span", "pill " + cls, label));
    tr.appendChild(tdSt);

    tr.appendChild(el("td", "t-prev", clip(r.question, 160) || "—"));
    // Reply preview: newlines collapsed so a markdown answer stays on one line here; the
    // full text (with formatting) is one click away in the detail panel.
    const answer = (r.answer || "").replace(/\s*\n+\s*/g, " ").trim();
    const tdAns = el("td", "t-ans", clip(answer, 160) || (r.error ? "(lỗi)" : "—"));
    tdAns.title = clip(answer, 400);
    tr.appendChild(tdAns);
    tr.addEventListener("click", () => openDetail(r.id));
    if (fresh) $("rows").prepend(tr); else $("rows").appendChild(tr);

    // Cap the DOM: a live tail left open all day must not grow without bound.
    const body = $("rows");
    while (body.children.length > 600) body.removeChild(body.lastChild);
  }

  function setSummary(total, shown) {
    $("summary").textContent = total == null
      ? `${shown} bản ghi`
      : `${shown} / ${total.toLocaleString("vi-VN")} bản ghi khớp bộ lọc`;
  }

  // ── search + pagination ────────────────────────────────────────────────────
  // `resetPage` = a filter changed, so go back to page 1; otherwise keep the current page.
  async function search(resetPage) {
    if (resetPage) state.page = 1;
    $("rows").textContent = "";
    $("empty").hidden = true;
    try {
      const p = params({ size: state.size, page: state.page });
      const data = await api(`${API}/search?${p}`);
      data.rows.forEach((r) => addRow(r, false));
      state.page = data.page; state.pages = data.pages; state.total = data.total;
      setSummary(data.total, data.rows.length);
      $("empty").hidden = data.rows.length > 0;
      renderPager(data.capped);
      // Anchor the realtime tail to the newest row currently visible.
      if (state.page === 1 && data.newest) state.cursor = data.newest;
      loadFacets();
    } catch (e) {
      if (e.message !== "unauthorized") $("summary").textContent = "Lỗi: " + e.message;
    }
  }

  function goPage(n) {
    const target = Math.min(Math.max(1, n), state.pages);
    if (target === state.page) return;
    state.page = target;
    if (state.live) setLive(false);   // paging away from the tail: stop following
    search(false);
    document.querySelector(".table-wrap").scrollTop = 0;
  }

  function renderPager(capped) {
    const { page, pages, total } = state;
    $("pgFirst").disabled = $("pgPrev").disabled = page <= 1;
    $("pgNext").disabled = $("pgLast").disabled = page >= pages;

    // Window of page numbers around the current one, with ellipses — a 200-page list of
    // buttons is unusable, and log traffic makes that count realistic.
    const nums = $("pgNums");
    nums.textContent = "";
    const want = new Set([1, pages, page, page - 1, page + 1, page - 2, page + 2]);
    const shown = [...want].filter((n) => n >= 1 && n <= pages).sort((a, b) => a - b);
    let prev = 0;
    shown.forEach((n) => {
      if (n - prev > 1) nums.appendChild(el("span", "pg-gap", "…"));
      const b = el("button", "pg", String(n));
      if (n === page) b.setAttribute("aria-current", "page");
      b.addEventListener("click", () => goPage(n));
      nums.appendChild(b);
      prev = n;
    });

    const from = total === 0 ? 0 : (page - 1) * state.size + 1;
    const to = Math.min(page * state.size, total);
    $("pgInfo").textContent = total === 0
      ? "Không có bản ghi"
      : `${from.toLocaleString("vi-VN")}–${to.toLocaleString("vi-VN")} / ${total.toLocaleString("vi-VN")}`
        + (capped ? " · chỉ duyệt được 10.000 bản ghi đầu, hãy thu hẹp bộ lọc" : "");
  }

  async function loadFacets() {
    try {
      const f = await api(`${API}/facets?${params({})}`);
      renderSidebar(f);
    } catch (_) { /* facets are decoration; a failure must not blank the page */ }
  }

  function renderSidebar(f) {
    const fns = f.functions || {};
    const wrap = $("fnList");
    wrap.textContent = "";
    const mk = (key, label, count, active, onClick) => {
      const b = el("button", "side-btn" + (active ? " active" : ""));
      b.appendChild(el("span", "lbl", label));
      if (count != null) b.appendChild(el("span", "count", String(count)));
      b.addEventListener("click", onClick);
      return b;
    };
    wrap.appendChild(mk("", "Tất cả", f.total ?? "", !state.fn, () => { state.fn = ""; search(true); }));
    Object.keys(FN_LABEL).forEach((k) => {
      if (!(k in fns) && state.fn !== k) return;
      wrap.appendChild(mk(k, FN_LABEL[k], fns[k] || 0, state.fn === k,
        () => { state.fn = k; search(true); }));
    });

    const st = $("stList");
    st.textContent = "";
    const blocked = (f.blocked || {})["true"] || 0;
    const errors = (f.errors || {})["true"] || 0;
    [["", "Tất cả", null], ["ok", "Thành công", null], ["error", "Lỗi", errors],
     ["blocked", "Bị chặn", blocked]].forEach(([k, label, n]) => {
      st.appendChild(mk(k, label, n, state.status === k, () => { state.status = k; search(true); }));
    });
  }

  function renderRanges() {
    const wrap = $("rangeList");
    wrap.textContent = "";
    const set = (hours) => {
      const now = new Date();
      const from = hours ? new Date(now.getTime() - hours * 3600e3) : null;
      const local = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000)
        .toISOString().slice(0, 16);
      $("to").value = local(now);
      $("from").value = from ? local(from) : "";
      search(true);
    };
    [["Hôm nay", 24], ["7 ngày", 24 * 7], ["30 ngày", 24 * 30], ["Tất cả", 0]].forEach(([label, h]) => {
      const b = el("button", "side-btn");
      b.appendChild(el("span", "lbl", label));
      b.addEventListener("click", () => set(h));
      wrap.appendChild(b);
    });
  }

  // ── detail drawer ──────────────────────────────────────────────────────────
  function contentBlock(title, text) {
    const box = el("div", "block");
    const h = el("h4", "", title);
    const len = el("span", "len", (text || "").length.toLocaleString("vi-VN") + " ký tự");
    const copy = el("button", "mini", "Sao chép");
    const toggle = el("button", "mini", "Mở rộng");
    h.append(len, copy, toggle);
    const pre = el("div", "content", text || "—");
    copy.addEventListener("click", () => navigator.clipboard?.writeText(text || "")
      .then(() => { copy.textContent = "Đã chép"; setTimeout(() => copy.textContent = "Sao chép", 1200); }));
    toggle.addEventListener("click", () => {
      pre.classList.toggle("open");
      toggle.textContent = pre.classList.contains("open") ? "Thu gọn" : "Mở rộng";
    });
    box.append(h, pre);
    return box;
  }

  async function openDetail(id) {
    if (!id) return;
    const body = $("dwBody");
    body.textContent = "";
    body.appendChild(el("div", "state", "Đang tải…"));
    $("drawer").classList.add("on");
    $("drawer").setAttribute("aria-hidden", "false");
    try {
      const r = await api(`${API}/detail/${encodeURIComponent(id)}`);
      $("dwTitle").textContent = (FN_LABEL[r.function] || r.function || "Bản ghi")
        + " · " + fmtTime(r["@timestamp"]);
      body.textContent = "";
      const dl = el("dl", "kv");
      const rows = [
        ["Thời gian", fmtTime(r["@timestamp"])], ["Chức năng", r.function],
        ["Endpoint", r.endpoint], ["Kiểu", r.stream ? "Streaming (SSE)" : "Thường"],
        ["Máy chủ", r.server_hostname], ["IP client", r.client_ip],
        ["X-Forwarded-For", r.client_forwarded_for], ["User-Agent", r.user_agent],
        ["Người dùng", r.user_id], ["Conversation", r.conversation_id],
        ["Profile", r.profile], ["Run ID", r.run_id], ["Request ID", r.request_id],
        ["Thời lượng", fmtMs(r.duration_ms)], ["HTTP", String(r.http_status ?? "")],
        ["Bị chặn", r.blocked ? "Có — " + (r.block_reason || "") : "Không"],
        ["Lỗi", r.error ? "Có — " + (r.error_detail || "") : "Không"],
        ["Cắt bớt nội dung", r.truncated ? "Có" : "Không"],
      ];
      rows.forEach(([k, v]) => {
        if (v == null || v === "") return;
        dl.appendChild(el("dt", "", k));
        dl.appendChild(el("dd", "", String(v)));
      });
      body.appendChild(dl);
      body.appendChild(contentBlock("Câu hỏi", r.question));
      body.appendChild(contentBlock("Câu trả lời", r.answer));
    } catch (e) {
      body.textContent = "";
      body.appendChild(el("div", "state", "Không tải được: " + e.message));
    }
  }

  // ── realtime ───────────────────────────────────────────────────────────────
  function setLive(on) {
    state.live = on;
    $("liveBtn").classList.toggle("on", on);
    $("liveDot").classList.toggle("on", on);
    $("liveTxt").textContent = on ? "Đang theo dõi" : "Live";
    if (!on) {
      if (state.es) { state.es.close(); state.es = null; }
      $("liveInfo").textContent = "";
      return;
    }
    const p = params({});
    if (state.cursor) p.set("after", JSON.stringify(state.cursor));
    const es = new EventSource(`${API}/stream?${p}`, { withCredentials: true });
    state.es = es;
    $("liveInfo").textContent = "Đang chờ bản ghi mới…";
    es.addEventListener("log", (ev) => {
      const r = JSON.parse(ev.data);
      state.cursor = r.sort || state.cursor;
      addRow(r, true);
      setSummary(null, $("rows").children.length);
      $("empty").hidden = true;
      $("liveInfo").textContent = "Mới nhất: " + fmtTime(r["@timestamp"]);
    });
    es.addEventListener("error", () => { $("liveInfo").textContent = "Mất kết nối — đang thử lại…"; });
  }

  // ── auth ───────────────────────────────────────────────────────────────────
  function showLogin() {
    if (state.es) { state.es.close(); state.es = null; }
    $("login").style.display = "grid";
    $("app").classList.remove("on");
  }
  function showApp(user) {
    $("login").style.display = "none";
    $("app").classList.add("on");
    $("whoami").textContent = user ? "Đang đăng nhập: " + user : "";
    renderRanges();
    search(true);
  }

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("loginErr").textContent = "";
    try {
      const res = await fetch(`${API}/login`, {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: $("u").value, password: $("p").value }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || "Đăng nhập thất bại");
      showApp(data.username);
    } catch (err) { $("loginErr").textContent = err.message; }
  });

  $("logout").addEventListener("click", async () => {
    await fetch(`${API}/logout`, { method: "POST", credentials: "same-origin" }).catch(() => {});
    showLogin();
  });

  // ── wiring ─────────────────────────────────────────────────────────────────
  $("toggleSide").addEventListener("click", () => {
    const collapsed = $("side").classList.toggle("collapsed");
    try { localStorage.setItem("secai_logs_side", collapsed ? "1" : "0"); } catch (_) {}
  });
  try {
    if (localStorage.getItem("secai_logs_side") === "1") $("side").classList.add("collapsed");
  } catch (_) {}

  $("searchBtn").addEventListener("click", () => search(true));
  $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") search(true); });
  ["from", "to", "field"].forEach((id) => $(id).addEventListener("change", () => search(true)));
  $("pgFirst").addEventListener("click", () => goPage(1));
  $("pgPrev").addEventListener("click", () => goPage(state.page - 1));
  $("pgNext").addEventListener("click", () => goPage(state.page + 1));
  $("pgLast").addEventListener("click", () => goPage(state.pages));
  $("pgSize").addEventListener("change", () => {
    state.size = parseInt($("pgSize").value, 10) || 50;
    search(true);
  });
  $("liveBtn").addEventListener("click", () => {
    // The tail only makes sense on page 1 (newest first) — jump back before following.
    if (!state.live && state.page !== 1) { state.page = 1; search(false).then(() => setLive(true)); }
    else setLive(!state.live);
  });
  $("dwClose").addEventListener("click", () => {
    $("drawer").classList.remove("on");
    $("drawer").setAttribute("aria-hidden", "true");
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && $("drawer").classList.contains("on")) $("dwClose").click();
  });
  // A hidden tab should not keep polling Elasticsearch every second.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && state.es) { state.es.close(); state.es = null; }
    else if (!document.hidden && state.live && !state.es) setLive(true);
  });

  api(`${API}/me`).then((me) => showApp(me.username)).catch(() => showLogin());
})();
</script>
</body>
</html>
