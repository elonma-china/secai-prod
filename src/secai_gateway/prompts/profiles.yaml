# Declarative profile registry — the single source of truth for per-endpoint behaviour.
#   prompt     : markdown file in this folder holding the profile's system prompt
#   tools      : tool names the agent may call in this profile (enforced per session)
#   base       : prepend the shared base_system.md? false = pure text-transform, no tools/RAG
#   max_turns  : agent loop cap for this profile
chat:
  prompt: chat.md
  # poc_fetch thêm 2026-09-21: chat drill-down 1 PoC cụ thể đã liệt kê qua poc_search cần
  # xem evidence thật (mã/README) thay vì bịa — cùng gate license với exploit_research
  # (poc/backend.py::_allow_code), KHÔNG mở quyền exec/verify nào thêm. Xem chat.md's
  # poc_drilldown_policy.
  tools: [qdrant_search, neo4j_search, poc_search, poc_fetch, web_fetch, fetch_reference]
  base: true
  max_turns: 10

exploit_research:
  prompt: exploit.md
  # poc_verify/poc_scan chỉ tồn tại khi VERIFY_ENABLED=true; poc_exec chỉ khi EXEC_ENABLED=true
  # poc_kt_exploit chỉ khi POC_EXPLOIT_ENABLED=true + POC_EXPLOIT_API_URL (runner bỏ qua tên chưa tạo)
  # web_search gated by WEB_SEARCH_ENABLED + SEARXNG_URL (runner skips the name when unbuilt).
  tools: [qdrant_search, neo4j_search, poc_search, poc_fetch, poc_verify, poc_scan, poc_exec, poc_kt_exploit, fetch_reference, web_search]
  base: true
  max_turns: 16

# BugHunter agent.py ReAct on Linch.
# Phases: AgentHunt → Validate (triage) → MapCVE → Report → Exploit(opt-in).
bughunt:
  prompt: bughunt.md
  tools:
    - bh_http_probe
    - run_recon
    - run_parallel_hunt_wave
    - run_vuln_scan
    - run_verify_leads
    - run_js_analysis
    - run_secret_hunt
    - run_param_discovery
    - run_post_param_discovery
    - run_api_fuzz
    - run_cors_check
    - run_cms_exploit
    - run_rce_scan
    - run_sqlmap_targeted
    - run_sqlmap_on_file
    - run_jwt_audit
    - read_recon_summary
    - read_findings_summary
    - update_working_memory
    - finish
  base: true
  max_turns: 32

translate:
  prompt: translate.md
  tools: []
  base: false
  max_turns: 2

ocr_correction:
  prompt: ocr_correction.md
  tools: []
  base: false
  max_turns: 2

translate_v2:
  prompt: translate_v2.md
  tools: []
  base: false
  max_turns: 2

translation_orchestrator:
  prompt: translation_orchestrator.md
  tools: [translation_specialist]
  base: false
  max_turns: 3

document_ocr:
  prompt: document_ocr.md
  tools: [ocr_extract, ocr_result]
  base: false
  max_turns: 3

# lane1 ReAct: mỗi lượt LLM xuất MỘT action JSON có cấu trúc; code (poc/lane1.py) parse + điều phối
# tool trong sandbox. KHÔNG native tool-call (Cyber-F1 gãy) → tools rỗng, base false (pure transform).
lane1_react:
  prompt: lane1.md
# Uncertain-band cascade judge (sanitize/cascade.py): decides injection-vs-legit-security-
# question for chat messages whose classifier score falls in the calibrated uncertain band.
# No tools — pure text-in, JSON-out; never sees anything beyond the one message + its score.
injection_judge:
  prompt: injection_judge.md
  tools: []
  base: false
  max_turns: 2

# Single-shot conversation auto-title (api/routes.py::_maybe_autotitle): summarizes the first
# Q&A pair of a new /ai/conversations/* thread into a short display title. Runs in the
# background after the first turn — never blocks the chat response. No tools, pure text→text.
conversation_title:
  prompt: conversation_title.md
  tools: []
  base: false
  max_turns: 2

# Single-shot PoC consolidation: merge a fetched PoC's full source (1+ files) into ONE
# self-contained runnable file for Section 1. No tools, no RAG — pure text→code transform.
poc_consolidate:
  prompt: consolidate.md
  tools: []
  base: false
  max_turns: 2

# Keep/drop decision for the deterministic slicer (poc/slicer.py): receives ONLY the AST
# structure graph (never source bytes), returns {"keep": [...], "drop": [...]}. No tools.
poc_slice:
  prompt: slice.md
  tools: []
  base: false
  max_turns: 2

report:
  prompt: report.md
  tools: [qdrant_search, neo4j_search]
  base: false
  max_turns: 6

statistical_report:
  prompt: statistical.md
  tools: [qdrant_search, neo4j_search]
  base: false
  max_turns: 6

# Additive review-authenticated Markdown template tools; existing report profiles unchanged.
report_template_edit:
  prompt: report_template_edit.md
  tools: []
  base: false
  max_turns: 2

report_template_render:
  prompt: report_template_render.md
  tools: []
  base: false
  max_turns: 2
