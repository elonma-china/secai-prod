# SecAI stack - core (gateway + qdrant + neo4j + redis + es) + profile exploit (vm-a, vm-b). Các profile translation, report, review do task sau thêm.
# Tên project lấy từ COMPOSE_PROJECT_NAME (mặc định secai-stack); `-p` ghi đè.
name: ${COMPOSE_PROJECT_NAME:-secai-stack}

x-vm-data:
  - &vm-data-1 ${DATA_ROOT:?set DATA_ROOT}/exploitdb:/srv/secai-data/exploitdb:ro
  - &vm-data-2 ${DATA_ROOT:?set DATA_ROOT}/poc:/srv/secai-data/poc:ro
  - &vm-data-3 ${DATA_ROOT:?set DATA_ROOT}/poc-sources:/srv/secai-data/poc-sources:ro
  - &vm-data-4 ${DATA_ROOT:?set DATA_ROOT}/exploitdb-mcp-server:/srv/secai-data/exploitdb-mcp-server:ro

# Auth engine: Basic, user mặc định `ias` (pentestcode/packages/opencode/src/server/auth.ts).
x-vm: &vm
  # Không dùng :? ở đây: compose nội suy cả service ngoài profile, `config` sẽ lỗi khi profile exploit tắt.
  # Thiếu VM_IMAGE thì pull thất bại ở tag MISSING-set-VM_IMAGE; up.sh phải kiểm VM_IMAGE khi bật exploit.
  image: ${VM_IMAGE:-secai-pentestcode-vm:MISSING-set-VM_IMAGE}
  profiles: [exploit]
  restart: unless-stopped
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]   # supervisor tạo user + chạy engine bằng user riêng
  security_opt: ["no-new-privileges:true"]
  mem_limit: ${VM_MEM_LIMIT:-48g}
  pids_limit: ${VM_PIDS_LIMIT:-16384}
  networks: [secai-net, poc-labs-internal]
  environment: &vmenv
    VM_SLOTS: ${VM_SLOTS:-12}
    VM_HOME_ROOT: /ias-pool-home
    OPENCODE_AUTO_UPDATE: "false"
    OPENCODE_ENABLE_QUESTION_TOOL: "true"
    OPENCODE_SERVER_PASSWORD: ${IAS_SERVER_PASSWORD:-}
    ORCAROUTER_API_KEY: ${ORCAROUTER_API_KEY:-}
    ORCA_LOCAL_BASE_URL: ${QWEN_BASE_URL:-}
    ORCA_LOCAL_API_KEY: ${QWEN_API_KEY:-}
    ORCA_LOCAL_MODEL_ID: ${QWEN_MODEL:-}
    ORCA_LOCAL_CONTEXT: ${QWEN_CONTEXT_WINDOW:-131072}
    NUCLEI_TEMPLATES: /srv/secai-data/poc-sources/nuclei-templates
  healthcheck:
    test: ["CMD-SHELL", 'if [ -n "$$OPENCODE_SERVER_PASSWORD" ]; then curl -fsS -u "ias:$$OPENCODE_SERVER_PASSWORD" http://127.0.0.1:$$VM_PORT_BASE/global/health; else curl -fsS http://127.0.0.1:$$VM_PORT_BASE/global/health; fi']
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 60s

services:
  gateway:
    image: ${GATEWAY_IMAGE:?set GATEWAY_IMAGE}
    restart: unless-stopped
    command: ["uvicorn", "secai_gateway.unified_app:app", "--host", "0.0.0.0", "--port", "8131"]
    env_file:
      - { path: .env, required: false }
    environment:
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://es:9200
      GATEWAY_DB_PATH: /app/data/gateway.db
      SESSION_STORE_BACKEND: sqlite
      SESSION_DB_PATH: /app/data/sessions.db
      EXPLOITDB_ROOT: /srv/exploitdb
      POC_CATALOG_DB: /srv/poc/catalog.db
      POC_ARTIFACT_STORE: /srv/poc-store
      POC_SOURCES_ROOT: /srv/poc-sources
      REWARD_SERVICE_URL: ""
      SHOWCASE_RETRAINING_UPSTREAM: ""
      SHOWCASE_TENSORBOARD_UPSTREAM: ""
      REVIEW_ENABLED: ${REVIEW_ENABLED:-false}
      # Pool tường minh (stack/lib/pool.sh); rỗng khi không bật profile exploit. Không dùng pool động (sinh tên pentestcode-N).
      IAS_SERVER_POOL: ${IAS_SERVER_POOL:-}
      IAS_POOL_GPU_COUNT: ${IAS_POOL_GPU_COUNT:-0}
      IAS_SERVER_PASSWORD: ${IAS_SERVER_PASSWORD:-}
    ports:
      - "${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_HOST_PORT:-8131}:8131"
    volumes:
      - gw-data:/app/data
      - ${DATA_ROOT:?set DATA_ROOT}/exploitdb:/srv/exploitdb:ro
      - ${DATA_ROOT:?set DATA_ROOT}/poc:/srv/poc
      - ${DATA_ROOT:?set DATA_ROOT}/poc/store:/srv/poc-store
      - ${DATA_ROOT:?set DATA_ROOT}/poc-sources:/srv/poc-sources:ro
      - pool-home-a:/ias-pool-home-a
      - pool-home-b:/ias-pool-home-b
    # Không depends_on vm-*: profile exploit tùy chọn, depends_on vào service ngoài profile làm config lỗi.
    depends_on:
      qdrant: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [secai-net, poc-labs-internal]

  qdrant:
    image: qdrant/qdrant:v1.10.1
    restart: unless-stopped
    ulimits:                               # collection lớn mở nhiều file RocksDB .sst
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ${DATA_ROOT:?set DATA_ROOT}/_state/qdrant_storage:/qdrant/storage
      - ${DATA_ROOT:?set DATA_ROOT}/qdrant:/qdrant/snapshots
    networks: [secai-net]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  neo4j:
    image: neo4j:5.20-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2g
    volumes:
      - ${DATA_ROOT:?set DATA_ROOT}/_state/neo4j_data:/data
      - ${DATA_ROOT:?set DATA_ROOT}/_state/neo4j_logs:/logs
    networks: [secai-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    networks: [secai-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"       # chỉ nội bộ secai-net, không publish cổng
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
      bootstrap.memory_lock: "true"
      cluster.routing.allocation.disk.watermark.low: "92%"
      cluster.routing.allocation.disk.watermark.high: "95%"
      cluster.routing.allocation.disk.watermark.flood_stage: "97%"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks: [secai-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # Engine pentestcode: mỗi container VM_SLOTS slot, mỗi slot 1 user Linux + HOME riêng. Cổng chỉ trong secai-net.
  vm-a:
    <<: *vm
    environment: {<<: *vmenv, VM_PORT_BASE: "5101"}
    volumes: [pool-home-a:/ias-pool-home, *vm-data-1, *vm-data-2, *vm-data-3, *vm-data-4]
  vm-b:
    <<: *vm
    environment: {<<: *vmenv, VM_PORT_BASE: "5201"}
    volumes: [pool-home-b:/ias-pool-home, *vm-data-1, *vm-data-2, *vm-data-3, *vm-data-4]

networks:
  secai-net:
    driver: bridge
  poc-labs-internal:
    name: ${POC_LABS_NETWORK:-poc-labs-internal}
    external: ${POC_LABS_EXTERNAL:-false}

volumes:
  gw-data:
  redis-data:
  es-data:
  pool-home-a:
  pool-home-b:
